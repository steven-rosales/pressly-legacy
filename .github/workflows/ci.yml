name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ci quality
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_WORKERS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm exec turbo test --concurrency=2

      - name: Tooling and architecture tests
        run: pnpm exec vitest run tooling/test

      - name: Validate LPMS Stateworks records
        run: |
          pnpm stateworks:memory:validate stateworks/memory/domains/laundry-production/memory.yaml
          pnpm stateworks:memory:validate stateworks/memory/domains/laundry-production/deltas/2026-07-10-fixed-pulse-scheduling.memory-delta.yaml
          pnpm stateworks:memory:validate stateworks/memory/domains/laundry-production/deltas/lpms-v1-implementation.memory-delta.yaml
          pnpm stateworks:validate stateworks/work/done/lpms-v1-happy-path/network.yaml
          pnpm stateworks:verify stateworks/work/done/lpms-v1-happy-path/network.yaml --state stateworks/work/done/lpms-v1-happy-path/state.yaml
          pnpm stateworks:validate stateworks/work/active/lpms-production-readiness/network.yaml
          pnpm stateworks:verify stateworks/work/active/lpms-production-readiness/network.yaml --state stateworks/work/active/lpms-production-readiness/state.yaml
          pnpm stateworks:memory:validate stateworks/memory/domains/identity-access/memory.yaml
          pnpm stateworks:validate stateworks/work/active/pressly-control-workforce-identity/network.yaml
          pnpm stateworks:verify stateworks/work/active/pressly-control-workforce-identity/network.yaml --state stateworks/work/active/pressly-control-workforce-identity/state.yaml

      - name: Build
        run: pnpm build

  integration-tests:
    name: ci integration tests
    runs-on: ubuntu-latest
    needs:
      - quality

    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: pressly_test
          POSTGRES_USER: pressly
          POSTGRES_PASSWORD: pressly
        options: >-
          --health-cmd "pg_isready -U pressly -d pressly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VITEST_MAX_WORKERS: 1
      PRESSLY_TEST_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/pressly_test
      PRESSLY_TEST_MIGRATION_DATABASE_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_TEST_RUNTIME_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_TEST_BACKUP_DATABASE_URL: postgres://pressly_backup:pressly_backup_test@localhost:5432/pressly_test
      PRESSLY_POSTGRES_LEDGER_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_TEST_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_TEST_DATABASE_RESET_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_CUSTOMERS_SYSTEM_TEST_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_CUSTOMERS_SYSTEM_TEST_DATABASE_RESET_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_CUSTOMERS_CONFORMANCE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_ACCESS_NATIVE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_ACCESS_CONFORMANCE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_ORDERS_INTAKE_CELL_TEST_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_ORDERS_INTAKE_CELL_TEST_DATABASE_RESET_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_ORDERS_SYSTEM_TEST_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_ORDERS_SYSTEM_TEST_DATABASE_RESET_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_ORDERS_CONFORMANCE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_ORDERS_CAPABILITIES_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_ORDERS_NATIVE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_PRICING_SYSTEM_TEST_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_PRICING_CONFORMANCE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_INGRESS_CONFORMANCE_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_INGRESS_CONFORMANCE_DATABASE_RESET_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_ORDERS_OUTBOX_CONFORMANCE_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_ORDERS_OUTBOX_CONFORMANCE_DATABASE_RESET_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_ORDERS_INTAKE_CONFORMANCE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_APPLY_FULFILLMENT_DEMAND_CONFORMANCE_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_APPLY_FULFILLMENT_DEMAND_CONFORMANCE_DATABASE_RESET_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_SOURCE_CLOSED_CONFORMANCE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_ATTEMPT_PLACEMENT_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_WEBHOOK_FLOW_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_ORDER_OUTBOX_FLOW_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_ACCEPT_SCHEDULE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_CREATE_SCHEDULE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_PLACEMENT_CONFORMANCE_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_PUBLISH_SCHEDULER_CONFIG_DATABASE_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_REPLACE_SHIFT_SELECTION_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres
      PRESSLY_UPDATE_SHIFT_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Build integration workspace
        run: pnpm build:integration-deps

      - name: Configure database roles
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/deploy/postgres:/sql:ro" \
            postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a \
            psql "$PRESSLY_TEST_ADMIN_DATABASE_URL" \
              -v database_name=pressly_test \
              -v migration_password=pressly_migration_test \
              -v runtime_password=pressly_runtime_test \
              -v backup_password=pressly_backup_test \
              -f /sql/configure-roles.sql

      - name: Run migrations as migration role
        run: DATABASE_URL="$PRESSLY_TEST_MIGRATION_DATABASE_URL" pnpm db:migrate

      - name: Migration and database privilege integration tests
        run: pnpm -F @pressly/migrations-verification test:postgres

      - name: PostgreSQL migration ledger integration tests
        run: pnpm -F @pressly/postgres test:postgres

      - name: Access-system PostgreSQL integration tests
        run: pnpm -F @pressly/access-system test:postgres

      - name: Access permanent conformance tests
        run: pnpm -F @pressly/access-verification test:postgres

      - name: Customers-system PostgreSQL integration tests
        run: pnpm -F @pressly/customers-system test:postgres

      - name: Customers permanent conformance tests
        run: pnpm -F @pressly/customers-verification test:postgres

      - name: Orders-system PostgreSQL integration tests
        run: pnpm -F @pressly/orders-system test:postgres

      - name: Orders permanent conformance tests
        run: pnpm -F @pressly/orders-verification test:postgres

      - name: Pricing-system PostgreSQL integration tests
        run: pnpm -F @pressly/pricing-system test:postgres

      - name: Pricing permanent conformance tests
        run: pnpm -F @pressly/pricing-verification test:postgres

      - name: Ingress-system PostgreSQL integration tests
        run: pnpm -F @pressly/ingress-system test:postgres

      - name: Ingress permanent conformance tests
        run: pnpm -F @pressly/ingress-verification test:postgres

      - name: Orders-outbox permanent conformance tests
        run: pnpm -F @pressly/orders-outbox-verification test:postgres

      - name: Production-system PostgreSQL integration tests
        run: pnpm -F @pressly/production-system test:postgres

      - name: Production command conformance tests
        run: pnpm -F @pressly/command-verification test:postgres

      - name: Production query conformance tests
        run: pnpm -F @pressly/query-verification test:postgres

      - name: Production scheduling conformance tests
        run: pnpm -F @pressly/scheduling-verification test:postgres

      - name: LPMS composed happy-path proof
        run: pnpm test:lpms:e2e

  browser-e2e:
    name: ci browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Install Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full disposable browser E2E
        run: pnpm test:browser:e2e

      - name: Upload synthetic browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/playwright/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  web-docker-build:
    name: ci web docker build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - browser-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
            NEXT_PUBLIC_ANALYTICS_ENABLED=false
            NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          cache-from: type=gha,scope=pressly-web
          cache-to: type=gha,mode=max,scope=pressly-web

  api-docker-build:
    name: ci api docker build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - browser-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/api/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=pressly-api
          cache-to: type=gha,mode=max,scope=pressly-api

  lpms-docker-build:
    name: ci lpms docker build (${{ matrix.app }})
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - browser-e2e
    strategy:
      fail-fast: false
      matrix:
        app:
          - worker
          - processor
          - control

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build LPMS image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/${{ matrix.app }}/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=pressly-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=pressly-${{ matrix.app }}

  production-artifacts:
    name: ci production artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-production
    needs:
      - integration-tests
      - browser-e2e
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          echo "api_tag=ghcr.io/$repository/api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "web_tag=ghcr.io/$repository/web:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "worker_tag=ghcr.io/$repository/worker:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "processor_tag=ghcr.io/$repository/processor:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "control_tag=ghcr.io/$repository/control:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate release telemetry configuration
        shell: bash
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          PROCESSOR_SENTRY_DSN: ${{ secrets.PROCESSOR_SENTRY_DSN }}
          CONTROL_SENTRY_DSN: ${{ secrets.CONTROL_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          PROCESSOR_SENTRY_PROJECT: ${{ vars.PROCESSOR_SENTRY_PROJECT }}
          CONTROL_SENTRY_PROJECT: ${{ vars.CONTROL_SENTRY_PROJECT }}
        run: |
          set -euo pipefail

          require_value() {
            local name="$1"
            local value="${!name-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "Required release telemetry configuration is missing: $name." >&2
              exit 1
            fi
          }

          validate_sentry_dsn() {
            local name="$1"
            local value="${!name}"
            if [[ ! "$value" =~ ^https://[^[:space:]@]+@[^[:space:]/]+/[0-9]+$ ]]; then
              echo "Required release telemetry configuration is invalid: $name." >&2
              exit 1
            fi
          }

          for name in \
            NEXT_PUBLIC_SENTRY_DSN \
            PROCESSOR_SENTRY_DSN \
            CONTROL_SENTRY_DSN \
            SENTRY_AUTH_TOKEN \
            SENTRY_ORG \
            PROCESSOR_SENTRY_PROJECT \
            CONTROL_SENTRY_PROJECT; do
            require_value "$name"
          done

          validate_sentry_dsn NEXT_PUBLIC_SENTRY_DSN
          validate_sentry_dsn PROCESSOR_SENTRY_DSN
          validate_sentry_dsn CONTROL_SENTRY_DSN

          if (( ${#SENTRY_AUTH_TOKEN} < 20 )) || \
            [[ "$SENTRY_AUTH_TOKEN" =~ [[:space:]] ]]; then
            echo "Required release telemetry configuration is invalid: SENTRY_AUTH_TOKEN." >&2
            exit 1
          fi

          for name in SENTRY_ORG PROCESSOR_SENTRY_PROJECT CONTROL_SENTRY_PROJECT; do
            if [[ ! "${!name}" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
              echo "Required release telemetry configuration is invalid: $name." >&2
              exit 1
            fi
          done

      - name: Build API image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/api/Dockerfile
          target: runner
          load: true
          tags: ${{ steps.images.outputs.api_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pressly-api
          cache-to: type=gha,mode=max,scope=pressly-api

      - name: Build web image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/web/Dockerfile
          target: runner
          load: true
          tags: ${{ steps.images.outputs.web_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            API_BASE_URL=http://api:4000
            NEXT_PUBLIC_API_BASE_URL=https://api.trypressly.com
            NEXT_PUBLIC_ANALYTICS_ENABLED=false
            NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
            SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=pressly-web
          cache-to: type=gha,mode=max,scope=pressly-web

      - name: Build Worker image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/worker/Dockerfile
          target: runner
          load: true
          tags: ${{ steps.images.outputs.worker_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pressly-worker
          cache-to: type=gha,mode=max,scope=pressly-worker

      - name: Build Processor image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/processor/Dockerfile
          target: runner
          load: true
          tags: ${{ steps.images.outputs.processor_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_SENTRY_DSN=${{ secrets.PROCESSOR_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_SENTRY_RELEASE=${{ github.sha }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.PROCESSOR_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.PROCESSOR_SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=pressly-processor
          cache-to: type=gha,mode=max,scope=pressly-processor

      - name: Build Control image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/control/Dockerfile
          target: runner
          load: true
          tags: ${{ steps.images.outputs.control_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_SENTRY_DSN=${{ secrets.CONTROL_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_SENTRY_RELEASE=${{ github.sha }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.CONTROL_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.CONTROL_SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=pressly-control
          cache-to: type=gha,mode=max,scope=pressly-control

      - name: Verify all images carry the release source SHA
        shell: bash
        env:
          API_TAG: ${{ steps.images.outputs.api_tag }}
          WEB_TAG: ${{ steps.images.outputs.web_tag }}
          WORKER_TAG: ${{ steps.images.outputs.worker_tag }}
          PROCESSOR_TAG: ${{ steps.images.outputs.processor_tag }}
          CONTROL_TAG: ${{ steps.images.outputs.control_tag }}
        run: |
          set -euo pipefail
          for image in "$API_TAG" "$WEB_TAG" "$WORKER_TAG" "$PROCESSOR_TAG" "$CONTROL_TAG"; do
            revision="$(
              docker image inspect \
                --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' \
                "$image"
            )"
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "Image $image was built from $revision, expected $GITHUB_SHA." >&2
              exit 1
            fi
          done

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Generate API SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ${{ steps.images.outputs.api_tag }}
          format: spdx-json
          output-file: artifacts/api.spdx.json
          upload-artifact: false

      - name: Generate web SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ${{ steps.images.outputs.web_tag }}
          format: spdx-json
          output-file: artifacts/web.spdx.json
          upload-artifact: false

      - name: Generate Worker SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ${{ steps.images.outputs.worker_tag }}
          format: spdx-json
          output-file: artifacts/worker.spdx.json
          upload-artifact: false

      - name: Generate Processor SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ${{ steps.images.outputs.processor_tag }}
          format: spdx-json
          output-file: artifacts/processor.spdx.json
          upload-artifact: false

      - name: Generate Control SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ${{ steps.images.outputs.control_tag }}
          format: spdx-json
          output-file: artifacts/control.spdx.json
          upload-artifact: false

      - name: Block critical API vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library

      - name: Block critical web vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.web_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library

      - name: Block critical Worker vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.worker_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library

      - name: Block critical Processor vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.processor_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library

      - name: Block critical Control vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.control_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified images
        shell: bash
        env:
          API_TAG: ${{ steps.images.outputs.api_tag }}
          WEB_TAG: ${{ steps.images.outputs.web_tag }}
          WORKER_TAG: ${{ steps.images.outputs.worker_tag }}
          PROCESSOR_TAG: ${{ steps.images.outputs.processor_tag }}
          CONTROL_TAG: ${{ steps.images.outputs.control_tag }}
        run: |
          set -euo pipefail
          push_image() {
            local image="$1"
            local attempt
            local delay_seconds

            for attempt in 1 2 3; do
              if docker push "$image"; then
                return 0
              fi

              if (( attempt == 3 )); then
                echo "Image publication failed after 3 attempts: $image" >&2
                return 1
              fi

              delay_seconds=$((attempt * 5))
              echo "Image publication attempt $attempt failed for $image; retrying in ${delay_seconds}s." >&2
              sleep "$delay_seconds"
            done
          }

          push_image "$API_TAG"
          push_image "$WEB_TAG"
          push_image "$WORKER_TAG"
          push_image "$PROCESSOR_TAG"
          push_image "$CONTROL_TAG"

      - name: Record immutable release manifest
        shell: bash
        env:
          API_TAG: ${{ steps.images.outputs.api_tag }}
          WEB_TAG: ${{ steps.images.outputs.web_tag }}
          WORKER_TAG: ${{ steps.images.outputs.worker_tag }}
          PROCESSOR_TAG: ${{ steps.images.outputs.processor_tag }}
          CONTROL_TAG: ${{ steps.images.outputs.control_tag }}
        run: |
          set -euo pipefail
          resolve_digest() {
            local tag="$1"
            local repository="${tag%:*}"
            local digest
            digest="$(
              docker buildx imagetools inspect \
                "$tag" \
                --format '{{.Manifest.Digest}}'
            )"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Registry returned an invalid digest for $tag." >&2
              exit 1
            fi
            printf '%s@%s' "$repository" "$digest"
          }

          export SOURCE_SHA="$GITHUB_SHA"
          export API_IMAGE="$(resolve_digest "$API_TAG")"
          export WEB_IMAGE="$(resolve_digest "$WEB_TAG")"
          export WORKER_IMAGE="$(resolve_digest "$WORKER_TAG")"
          export PROCESSOR_IMAGE="$(resolve_digest "$PROCESSOR_TAG")"
          export CONTROL_IMAGE="$(resolve_digest "$CONTROL_TAG")"

          verify_registry_revision() {
            local image="$1"
            local revision
            docker pull "$image" >/dev/null
            revision="$(
              docker image inspect \
                --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' \
                "$image"
            )"
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "Registry image $image was built from $revision, expected $GITHUB_SHA." >&2
              exit 1
            fi
          }
          for image in "$API_IMAGE" "$WEB_IMAGE" "$WORKER_IMAGE" "$PROCESSOR_IMAGE" "$CONTROL_IMAGE"; do
            verify_registry_revision "$image"
          done

          export BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node tooling/scripts/release-manifest.mjs create > artifacts/release.json
          EXPECTED_SOURCE_SHA="$GITHUB_SHA" \
            node tooling/scripts/release-manifest.mjs validate artifacts/release.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  required:
    name: ci required
    if: always()
    runs-on: ubuntu-latest
    needs:
      - quality
      - integration-tests
      - browser-e2e
      - web-docker-build
      - api-docker-build
      - lpms-docker-build
      - production-artifacts
    permissions:
      contents: read

    steps:
      - name: Verify required CI paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          WEB_BUILD_RESULT: ${{ needs.web-docker-build.result }}
          API_BUILD_RESULT: ${{ needs.api-docker-build.result }}
          LPMS_BUILD_RESULT: ${{ needs.lpms-docker-build.result }}
          PRODUCTION_RESULT: ${{ needs.production-artifacts.result }}
        run: |
          set -euo pipefail

          expect_result() {
            local name="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "$name finished as $actual; expected $expected." >&2
              exit 1
            fi
          }

          expect_result quality "$QUALITY_RESULT" success
          expect_result integration-tests "$INTEGRATION_RESULT" success
          expect_result browser-e2e "$BROWSER_RESULT" success

          if [[ "$EVENT_NAME" == push && "$REF" == refs/heads/main ]]; then
            expect_result web-docker-build "$WEB_BUILD_RESULT" skipped
            expect_result api-docker-build "$API_BUILD_RESULT" skipped
            expect_result lpms-docker-build "$LPMS_BUILD_RESULT" skipped
            expect_result production-artifacts "$PRODUCTION_RESULT" success
          elif [[ "$REF" != refs/heads/main ]]; then
            expect_result web-docker-build "$WEB_BUILD_RESULT" success
            expect_result api-docker-build "$API_BUILD_RESULT" success
            expect_result lpms-docker-build "$LPMS_BUILD_RESULT" success
            expect_result production-artifacts "$PRODUCTION_RESULT" skipped
          else
            expect_result web-docker-build "$WEB_BUILD_RESULT" skipped
            expect_result api-docker-build "$API_BUILD_RESULT" skipped
            expect_result lpms-docker-build "$LPMS_BUILD_RESULT" skipped
            expect_result production-artifacts "$PRODUCTION_RESULT" skipped
          fi
