name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ci quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration-tests:
    name: ci integration tests
    runs-on: ubuntu-latest
    needs:
      - quality

    services:
      postgres:
        image: postgres:18-bookworm
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: pressly_test
          POSTGRES_USER: pressly
          POSTGRES_PASSWORD: pressly
        options: >-
          --health-cmd "pg_isready -U pressly -d pressly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PRESSLY_TEST_DATABASE_URL: postgres://pressly:pressly@localhost:5432/pressly_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Run migrations
        run: DATABASE_URL="$PRESSLY_TEST_DATABASE_URL" pnpm -F @pressly/db migrate

      - name: Auth integration tests
        run: pnpm -F @pressly/auth-module test:integration

      - name: Pricing integration tests
        run: pnpm -F @pressly/pricing test:integration

  web-docker-build:
    name: ci web docker build
    runs-on: ubuntu-latest
    needs:
      - integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
            NEXT_PUBLIC_ANALYTICS_ENABLED=false
            NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          cache-from: type=gha,scope=pressly-web
          cache-to: type=gha,mode=max,scope=pressly-web

  api-docker-build:
    name: ci api docker build
    runs-on: ubuntu-latest
    needs:
      - integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=pressly-api
          cache-to: type=gha,mode=max,scope=pressly-api
