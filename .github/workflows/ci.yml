name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ci quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Security script tests
        run: node --test tooling/test/*.test.mjs

      - name: Build
        run: pnpm build

  integration-tests:
    name: ci integration tests
    runs-on: ubuntu-latest
    needs:
      - quality

    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: pressly_test
          POSTGRES_USER: pressly
          POSTGRES_PASSWORD: pressly
        options: >-
          --health-cmd "pg_isready -U pressly -d pressly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PRESSLY_TEST_ADMIN_DATABASE_URL: postgres://pressly:pressly@localhost:5432/pressly_test
      PRESSLY_TEST_MIGRATION_DATABASE_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test
      PRESSLY_TEST_RUNTIME_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_TEST_BACKUP_DATABASE_URL: postgres://pressly_backup:pressly_backup_test@localhost:5432/pressly_test
      PRESSLY_TEST_DATABASE_URL: postgres://pressly_runtime:pressly_runtime_test@localhost:5432/pressly_test
      PRESSLY_TEST_DATABASE_RESET_URL: postgres://pressly_migration:pressly_migration_test@localhost:5432/pressly_test

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Configure database roles
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/infra/postgres:/sql:ro" \
            postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a \
            psql "$PRESSLY_TEST_ADMIN_DATABASE_URL" \
              -v database_name=pressly_test \
              -v migration_password=pressly_migration_test \
              -v runtime_password=pressly_runtime_test \
              -v backup_password=pressly_backup_test \
              -f /sql/configure-roles.sql

      - name: Run migrations as migration role
        run: DATABASE_URL="$PRESSLY_TEST_MIGRATION_DATABASE_URL" pnpm -F @pressly/db migrate

      - name: Database privilege integration tests
        run: pnpm -F @pressly/db test:integration

      - name: Auth integration tests
        run: pnpm -F @pressly/auth-module test:integration

      - name: Pricing integration tests
        run: pnpm -F @pressly/pricing test:integration

  web-docker-build:
    name: ci web docker build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
            NEXT_PUBLIC_ANALYTICS_ENABLED=false
            NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          cache-from: type=gha,scope=pressly-web
          cache-to: type=gha,mode=max,scope=pressly-web

  api-docker-build:
    name: ci api docker build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=pressly-api
          cache-to: type=gha,mode=max,scope=pressly-api

  production-artifacts:
    name: ci production artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - integration-tests
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          echo "api_tag=ghcr.io/$repository/api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "web_tag=ghcr.io/$repository/web:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build API image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          load: true
          tags: ${{ steps.images.outputs.api_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pressly-api
          cache-to: type=gha,mode=max,scope=pressly-api

      - name: Build web image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          load: true
          tags: ${{ steps.images.outputs.web_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            API_BASE_URL=http://api:4000
            NEXT_PUBLIC_API_BASE_URL=https://api.trypressly.com
            NEXT_PUBLIC_ANALYTICS_ENABLED=false
            NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
          cache-from: type=gha,scope=pressly-web
          cache-to: type=gha,mode=max,scope=pressly-web

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Generate API SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ${{ steps.images.outputs.api_tag }}
          format: spdx-json
          output-file: artifacts/api.spdx.json
          upload-artifact: false

      - name: Generate web SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ${{ steps.images.outputs.web_tag }}
          format: spdx-json
          output-file: artifacts/web.spdx.json
          upload-artifact: false

      - name: Block critical API vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library

      - name: Block critical web vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.web_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library

      - name: Publish verified images
        shell: bash
        env:
          API_TAG: ${{ steps.images.outputs.api_tag }}
          WEB_TAG: ${{ steps.images.outputs.web_tag }}
        run: |
          set -euo pipefail
          docker push "$API_TAG"
          docker push "$WEB_TAG"

      - name: Record immutable release manifest
        shell: bash
        env:
          API_TAG: ${{ steps.images.outputs.api_tag }}
          WEB_TAG: ${{ steps.images.outputs.web_tag }}
        run: |
          set -euo pipefail
          export SOURCE_SHA="$GITHUB_SHA"
          export API_IMAGE="$(docker inspect --format='{{index .RepoDigests 0}}' "$API_TAG")"
          export WEB_IMAGE="$(docker inspect --format='{{index .RepoDigests 0}}' "$WEB_TAG")"
          export BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node tooling/scripts/release-manifest.mjs create > artifacts/release.json
          node tooling/scripts/release-manifest.mjs validate artifacts/release.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
