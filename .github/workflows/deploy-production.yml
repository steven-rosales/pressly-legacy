name: deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA with a successful CI run
        required: true

  workflow_run:
    workflows:
      - ci
    branches:
      - main
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: deploy to lightsail
    runs-on: ubuntu-latest
    environment: production

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve deploy ref
        id: deploy-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.ref }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="$(node tooling/scripts/deployment-selection.mjs)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying source commit: $sha"

      - name: Verify manual commit passed CI
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.deploy-ref.outputs.sha }}
        run: |
          set -euo pipefail

          gh api "/repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA" >/dev/null
          successful_runs="$(
            gh api \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&branch=main&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )"

          if [[ "$successful_runs" -lt 1 ]]; then
            echo "Commit $DEPLOY_SHA has no successful completed CI run." >&2
            exit 1
          fi

      - name: Resolve successful CI run
        id: ci-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.deploy-ref.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="$WORKFLOW_RUN_ID"
          else
            run_id="$(
              gh api \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&branch=main&event=push&status=completed&per_page=100" \
                --jq '.workflow_runs | map(select(.conclusion == "success")) | first | .id'
            )"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Checkout deployed release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.deploy-ref.outputs.sha }}

      - name: Download verified release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci-run.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$CI_RUN_ID" --name production-release --dir release

      - name: Validate immutable release manifest
        id: release
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.deploy-ref.outputs.sha }}
        run: |
          set -euo pipefail
          node tooling/scripts/release-manifest.mjs validate release/release.json >/dev/null
          node - <<'NODE'
          const manifest = require('./release/release.json');
          const output = process.env.GITHUB_OUTPUT;
          require('node:fs').appendFileSync(
            output,
            `api_image=${manifest.apiImage}\nweb_image=${manifest.webImage}\nworker_image=${manifest.workerImage}\nprocessor_image=${manifest.processorImage}\ncontrol_image=${manifest.controlImage}\n`,
          );
          NODE

      - name: Install SSH key
        shell: bash
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail

      - name: Install verified Lightsail host key
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LIGHTSAIL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$LIGHTSAIL_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Run deployment
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DEPLOY_SHA: ${{ steps.deploy-ref.outputs.sha }}
          API_IMAGE: ${{ steps.release.outputs.api_image }}
          WEB_IMAGE: ${{ steps.release.outputs.web_image }}
          WORKER_IMAGE: ${{ steps.release.outputs.worker_image }}
          PROCESSOR_IMAGE: ${{ steps.release.outputs.processor_image }}
          CONTROL_IMAGE: ${{ steps.release.outputs.control_image }}
        run: |
          set -euo pipefail

          if [[ ! "$LIGHTSAIL_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo 'LIGHTSAIL_HOST must be an IPv4 address.' >&2
            exit 1
          fi
          IFS=. read -r host_a host_b host_c host_d <<< "$LIGHTSAIL_HOST"
          for host_octet in "$host_a" "$host_b" "$host_c" "$host_d"; do
            if (( 10#$host_octet > 255 )); then
              echo 'LIGHTSAIL_HOST must be an IPv4 address.' >&2
              exit 1
            fi
          done

          ssh_args=(
            -i ~/.ssh/lightsail
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          remote_dir=''
          cleanup_remote() {
            if [[ -n "$remote_dir" ]]; then
              ssh "${ssh_args[@]}" \
                "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
                "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_remote EXIT

          remote_dir="$(
            ssh "${ssh_args[@]}" \
              "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
              'umask 077; mktemp -d /tmp/pressly-deploy.XXXXXXXX'
          )"
          [[ "$remote_dir" =~ ^/tmp/pressly-deploy\.[A-Za-z0-9]+$ ]]

          local_deploy_script='infra/aws/lightsail/deploy.sh'
          remote_deploy_script="$remote_dir/deploy.sh"
          deploy_script_digest="$(sha256sum "$local_deploy_script" | cut -d' ' -f1)"

          scp "${ssh_args[@]}" \
            "$local_deploy_script" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$remote_deploy_script"

          ssh \
            "${ssh_args[@]}" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "set -euo pipefail; test \"\$(stat -c '%a' '$remote_dir')\" = 700; chmod 700 '$remote_deploy_script'; printf '%s  %s\\n' '$deploy_script_digest' '$remote_deploy_script' | sha256sum --check --status; DEPLOY_SHA='$DEPLOY_SHA' PRESSLY_EXPECTED_PUBLIC_IP='$LIGHTSAIL_HOST' PRESSLY_API_IMAGE='$API_IMAGE' PRESSLY_WEB_IMAGE='$WEB_IMAGE' PRESSLY_WORKER_IMAGE='$WORKER_IMAGE' PRESSLY_PROCESSOR_IMAGE='$PROCESSOR_IMAGE' PRESSLY_CONTROL_IMAGE='$CONTROL_IMAGE' '$remote_deploy_script'"

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deploy-ref.outputs.sha }}
          DEPLOY_OUTCOME: ${{ job.status }}
        run: |
          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            event='deployment.succeeded'
            outcome='succeeded'
          else
            event='deployment.failed'
            outcome='failed'
          fi
          printf '{"name":"%s","outcome":"%s","sourceSha":"%s","occurredAt":"%s"}\n' \
            "$event" \
            "$outcome" \
            "$DEPLOY_SHA" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
