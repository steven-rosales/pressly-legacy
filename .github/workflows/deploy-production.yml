name: deploy production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

  workflow_run:
    workflows:
      - ci
    branches:
      - main
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy to lightsail
    runs-on: ubuntu-latest
    environment: production

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Resolve deploy branch
        id: deploy-branch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BRANCH: ${{ inputs.branch }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            branch="$WORKFLOW_RUN_BRANCH"
          else
            branch="$MANUAL_BRANCH"
          fi

          case "$branch" in
            "")
              echo "Missing deploy branch" >&2
              exit 1
              ;;
            *[!a-zA-Z0-9._/-]*)
              echo "Invalid branch name: $branch" >&2
              exit 1
              ;;
          esac

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        shell: bash
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail

      - name: Trust Lightsail host
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail

          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Run deployment
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DEPLOY_BRANCH: ${{ steps.deploy-branch.outputs.branch }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/lightsail \
            -o IdentitiesOnly=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "DEPLOY_BRANCH='$DEPLOY_BRANCH' /opt/pressly/repo/infra/aws/lightsail/deploy.sh"
