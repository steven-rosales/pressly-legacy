name: browser e2e

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    name: nightly browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: Install Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the complete disposable browser suite
        run: pnpm test:browser:e2e

      - name: Upload synthetic browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/playwright/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
