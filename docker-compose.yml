name: pressly

services:
  postgres:
    image: postgres:18-bookworm
    ports:
      - '${POSTGRES_PORT:-55433}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pressly}
      POSTGRES_USER: ${POSTGRES_USER:-pressly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pressly}
    volumes:
      - pressly_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-pressly} -d ${POSTGRES_DB:-pressly}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:18-bookworm
    ports:
      - '${POSTGRES_TEST_PORT:-55434}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-pressly_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-pressly}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-pressly}
    volumes:
      - pressly_postgres_test_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_TEST_USER:-pressly} -d ${POSTGRES_TEST_DB:-pressly_test}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: pressly-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - '${API_PORT:-4000}:4000'
    environment:
      CI: 'true'
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgres://pressly:pressly@postgres:5432/pressly
      DATABASE_MAX_CONNECTIONS: 10
      SHUTDOWN_GRACE_PERIOD_MS: 30000
      CORS_ORIGIN: http://localhost:3000,http://localhost:4173
      AUTH_SECRET: local-dev-auth-secret
      AUTH_MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_METRICS_ENABLED: false
      FEATURE_JOBS_ENABLED: false
      SENTRY_ENABLED: false
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "pnpm install --frozen-lockfile
      && pnpm -F @pressly/db migrate
      && pnpm -F @pressly/db seed:pricing
      && pnpm -F @pressly/api bootstrap:production --
      --file /repo/tooling/fixtures/pressly-one.production-bootstrap.json
      --actor-id 00000000-0000-4000-8000-000000000001
      --idempotency-key local-pressly-one-topology-v1
      --apply
      && pnpm -F @pressly/api dev"
    volumes:
      - .:/repo
      - pressly_node_modules:/repo/node_modules
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:4000/health/ready >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${PRESSLY_WEB_IMAGE:-pressly-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      extra_hosts:
        - 'host.docker.internal:host-gateway'
      args:
        API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:4000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
        NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-false}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:4000}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
      NEXT_PUBLIC_ANALYTICS_ENABLED: ${NEXT_PUBLIC_ANALYTICS_ENABLED:-false}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: pressly-worker:local
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runner
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://pressly:pressly@postgres:5432/pressly
      FEATURE_JOBS_ENABLED: 'true'
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_LEASE_MS: 30000
      WORKER_BATCH_SIZE: 20
      WORKER_MAX_ATTEMPTS: 8
      WORKER_RETRY_BASE_MS: 1000
      WORKER_RETRY_MAX_MS: 300000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  processor:
    image: pressly-processor:local
    build:
      context: .
      dockerfile: apps/processor/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - '${PROCESSOR_PORT:-4173}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pressly_postgres_data:
  pressly_postgres_test_data:
  pressly_node_modules:
