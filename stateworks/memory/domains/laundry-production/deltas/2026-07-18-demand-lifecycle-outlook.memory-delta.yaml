id: memdelta-2026-07-18-demand-lifecycle-outlook
domain_id: laundry-production

source:
  type: implementation_evidence
  path: stateworks/work/done/lpms-demand-lifecycle-outlook/evidence.md

changes:
  - op: assert
    kind: object
    id: demand_outlook
    description: A location- and shift-scoped read-only projection of external
      order demand, production admission, and source-versus-floor comparison;
      it is advisory planning context rather than executable production state.

  - op: assert
    kind: workflow
    id: external_demand_to_production_admission
    steps:
      - a strictly newer Cents order revision is normalized to one canonical demand phase at the vendor adapter boundary
      - LPMS persists the source phase, source status, due time, estimated weight, and weight provenance without treating them as floor truth
      - active demand due through the shift's local service-day cutoff appears in the advisory demand outlook
      - physical bag intake or a production-released source phase may make the order production-ready only when weight and bag-count rules hold
      - executable scheduling reads only admitted production orders with known bag counts
      - a downstream, withdrawn, or lagging source status is compared with LPMS and requires operator-confirmed reconciliation when the systems disagree

  - op: assert
    kind: invariant
    id: source_lifecycle_does_not_advance_floor_truth_v1
    statement: A Cents lifecycle revision may update external demand and
      reconciliation state, but it cannot start, advance, finish, cancel, or
      rewind an LPMS order, batch, stage, run, or shift.

  - op: assert
    kind: invariant
    id: physical_intake_can_admit_lagging_source_v1
    statement: Physical intake with a recorded bag count may admit expected or
      inbound demand to Production when weight and eligibility rules hold even
      if the latest Cents status has not reached IN_PROGRESS.

  - op: assert
    kind: invariant
    id: committed_work_survives_source_withdrawal_v1
    statement: A downstream or canceled Cents revision preserves physically
      received or committed LPMS work and creates reconciliation attention
      instead of silently removing or terminalizing that work.

  - op: assert
    kind: invariant
    id: advisory_demand_forecast_is_non_executable_v1
    statement: The shift demand forecast is deterministic, read-only,
      weight-only, and non-persistent; it cannot be accepted or started and it
      never fabricates bag counts or changes the executable scheduling snapshot.

  - op: assert
    kind: policy
    id: cents_lifecycle_phase_mapping_v1
    statement: SUBMITTED and READY_FOR_PICKUP are expected, PICKED_UP is
      inbound, IN_PROGRESS is production released, READY_FOR_RETURN,
      OUT_FOR_DELIVERY, and COMPLETED are post-production comparison signals,
      and canceled is withdrawn.

  - op: assert
    kind: policy
    id: service_day_demand_horizon_v1
    statement: The advisory demand horizon includes overdue demand and active
      demand due before the end of the local calendar day containing the
      production shift end; later demand is outside that outlook.

  - op: assert
    kind: decision
    id: source_floor_mismatch_requires_operator_confirmation_v1
    statement: Because Cents and LPMS are independent systems connected by the
      webhook, a lifecycle disagreement is surfaced for comparison and LPMS
      requires operator confirmation against physical truth before changing
      canonical floor progression.

verification:
  - The source evidence records the implemented Worker adapter, Production policy and persistence, migration, deterministic scheduling computation, contracts, and Processor surface.
  - Policy, Worker, database, scheduling, Production, contracts, and Processor focused suites passed; the canonical LPMS integration command passed all constituent suites and migrations.
  - The source evidence explicitly distinguishes repository proof from production deployment, live-vendor replay, and existing-row reprojection.
  - The delta preserves LPMS floor authority and adds only confirmed lifecycle, service-day outlook, physical-admission, and reconciliation rules.
  - The accepted delta was applied exactly once to laundry-production memory v9, advancing it to v10 before context-pack regeneration.

status: applied
