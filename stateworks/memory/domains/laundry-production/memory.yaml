domain_id: laundry-production
name: Laundry Production
version: 16
status: active
summary: >
  Durable business memory for Pressly's wash-and-fold production process. LPMS
  is the product/system being built; laundry-production is the business domain.
actors:
  - id: operator
    description: A person using LPMS to execute or confirm production-floor work.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: manager
    description:
      A person who can create, review, accept, and supervise production
      schedules and runs.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: employee
    description:
      A production worker who performs sorting, washing, drying, folding,
      or packaging work.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
external_systems:
  - id: cents
    description: The v1 CRM/vendor system and external order authority for
      webhook-driven order demand.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
objects:
  - id: crm_order
    description:
      The normalized projection of a Cents order; it is external demand,
      not production truth.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: production_order
    description:
      The internal LPMS execution projection of one source-neutral Order
      fulfillment that may become eligible for production scheduling.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-20-source-neutral-order-boundary
  - id: schedule_run
    description:
      An immutable scheduler proposal containing input snapshot, output
      plan, hashes, score, and warnings.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: production_run
    description:
      The sole execution aggregate for one production shift, created only
      when its current accepted schedule plan is started.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-14-run-centered-online-scheduling
  - id: production_batch
    description: A real group of production orders moving together through the
      floor; it is not a washer load.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: stage_run
    description: The state-machine owner for one physical process step of one
      production batch.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: stage_machine_assignment
    description: A stage-level assignment of one physical machine to a stage run.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: machine
    description:
      A physical constrained production resource such as a washer, dryer,
      or folding station.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: scheduler_config
    description:
      Versioned configuration for pulse duration, folding rate, algorithm
      version, and scheduler behavior.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: work_event
    description: The authoritative mutation ledger and audit trail for production changes.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: production_order_stage_attempt
    description: A numbered assignment of one production_order to one canonical
      stage_run; its assignment identity is immutable, while its lifecycle
      closes as completed or released to preserve order routing history.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: demand_outlook
    description:
      A location- and shift-scoped read-only projection of external order
      demand, production admission, and source-versus-floor comparison; it is
      advisory planning context rather than executable production state.
    status: deprecated
    sources:
      - memdelta-2026-07-18-demand-lifecycle-outlook
  - id: remaining_day_outlook
    description:
      A location- and local-service-day-scoped deterministic, read-only
      projection of unfinished Pressly work still relevant today, partitioned
      into active production, ready placement, expected later, and another-shift
      or unassigned work; it is operational planning context, not executable
      state.
    status: active
    sources:
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
  - id: production_order_resolution
    description:
      An orthogonal persistent Production lifecycle for work that will
      not be produced in Pressly; it removes the work from active operations
      while retaining an audited, restorable record and does not represent
      execution, completion, source cancellation, or deletion.
    status: active
    sources:
      - memdelta-2026-07-27-production-order-resolution
states:
  schedule_run:
    - draft
    - accepted
    - superseded
    - rejected
  production_run:
    - planned
    - started
    - completed
    - canceled
  production_batch:
    - queued
    - sorting
    - washing
    - drying
    - folding_packaging
    - finished
    - canceled
    - blocked
  stage_run:
    - planned
    - started
    - completed
    - blocked
    - canceled
workflows:
  - id: production_batch_happy_path
    steps:
      - queued
      - sorting
      - washing
      - drying
      - folding_packaging
      - finished
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: scheduling_to_execution
    steps:
      - API durably receives and projects canonical external order demand
      - eligible production_orders form the complete immutable scheduling
        snapshot for one shift
      - Compute creates a new immutable schedule_run revision and supersedes the
        prior current revision
      - manager reviews warnings and accepts the current output hash without
        creating execution
      - Start revalidates the current accepted revision, exact eligible-order
        snapshot, and active shift window
      - LPMS creates the shift's sole started production_run and its initial
        batches, stages, assignments, order transitions, and work_event
        atomically
      - operators advance server-authorized stage_run actions; an
        otherwise-valid early start or completion requires an exact current
        confirmation and never rewrites planned stage windows
      - after reconnect, an operator may reconcile one batch to a strictly later
        physical milestone through a previewed and exact-version confirmation
        without synthetic stage events
      - post-start arrivals are placed into the existing production_run without
        moving existing orders automatically
      - employees may explicitly rebatch a whole queued order or defer and
        rework a whole in-flight order into a later batch without changing
        canonical batch-stage progression
      - final folding and packaging completion, whether live or reconciled,
        terminalizes the remaining floor facts, completes the run, and closes
        the shift atomically
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-lpms-v1-implementation
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
      - memdelta-2026-07-15-operator-workspace-live-sync
      - memdelta-2026-07-15-floor-truth-reconciliation
      - memdelta-2026-07-15-order-control-history
  - id: production_command_write_path
    steps:
      - receive command
      - validate invariants
      - insert work_event
      - update operational tables
      - commit transaction
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: fixed_pulse_pipeline
    steps:
      - sorting for one pulse
      - washing for one pulse
      - drying for one pulse
      - folding_packaging for one pulse
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: live_order_placement
    steps:
      - an order becomes eligible after its shift's production_run has started
      - LPMS reads the versioned ordered batch queue and immutable resource
        snapshot
      - pure online insertion computes an automatic or manager-exact placement
        proposal
      - LPMS rejects hard-capacity violations and requests version-bound
        confirmation for overtime
      - LPMS commits the placement and affected mutable suffix under the
        expected queue version
      - LPMS records placement provenance and a work_event
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: batch_membership_control
    steps:
      - employee explicitly freezes a queued batch when physical grouping begins
      - freezing anchors membership and queue position
      - starting any batch implicitly and permanently freezes membership
      - if queued unfreeze is enabled under the implementation assumption, it
        requires an authorized manager, confirmation, and audit
      - non-queued batches cannot be unfrozen
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: prestart_shift_revision
    steps:
      - manager edits shift start, end, or effective folder count before
        execution exists
      - LPMS locks the location scheduling scope and compares the shift version
      - LPMS persists the complete shift settings and records one idempotent
        work_event
      - a material change supersedes the current schedule revision and revokes
        acceptance
      - a no-op preserves the current schedule revision
      - manager computes a new immutable plan from the persisted shift facts
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: production_workspace_live_refresh
    steps:
      - a committed production work_event advances the owning location's durable
        live revision
      - PostgreSQL notification wakes the authenticated location-authorized SSE
        stream
      - the Processor coalesces the invalidation with any in-flight or
        post-command refresh
      - the Processor reloads the authoritative workspace or board through its
        ordinary HTTP read
      - initial connection, reconnect, or upstream-listener recovery also forces
        an authoritative resync
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: floor_truth_recovery_after_reconnect
    steps:
      - the backend becomes reachable after physical work continued or floor
        updates were missed
      - the operator selects one batch, a strictly later milestone, a reason, an
        optional note, and machines only when the target leaves washing or
        drying active
      - LPMS locks the run, batch, and canonical stages and validates exact
        queue, batch, and stage versions
      - LPMS validates sequential progress, one active batch per stage kind,
        machine compatibility and availability, and hard capacity
      - LPMS returns the exact projected effects and a canonical confirmation
        hash without mutating state
      - operator confirmation recomputes and commits only when the hash and all
        versions remain current
      - LPMS updates the current projection atomically, preserves unknown
        skipped boundaries, and appends one batch_progress_reconciled work_event
      - the work_event advances one live revision and the Processor reloads the
        authoritative board
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: order_level_routing
    steps:
      - employee opens one order from the server-paginated Home projection
      - queued rebatch requires an unfrozen queued source and an exact selected
        mutable queued target
      - in-flight defer or rework selects a reason and restart stage that does
        not skip required work
      - pure policy chooses the earliest feasible later batch for an in-flight
        route and validates whole-order hard capacity across the required stage
        suffix
      - LPMS returns an exact version-bound proposal hash without mutation
      - confirmation reloads and locks the current routing context, recomputes
        the proposal, and rejects drift
      - one transaction releases the source membership and unfinished attempts,
        inserts the target membership and new attempts, updates aggregate
        weights and versions, and appends one order-routing work_event
      - the Processor refreshes authoritative order and board projections
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: production_history_review
    steps:
      - authorized user opens the read-only History workspace
      - LPMS returns bounded keyset pages for production runs, sanitized
        activity, or schedule plans
      - cursors remain bound to the selected history view and filters
      - opening a run loads batches, canonical stage progress, every historical
        order-membership episode, schedule lineage, and a bounded newest-first
        activity window
      - raw work_event payloads and private idempotency data remain
        server-internal
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: external_demand_to_production_admission
    steps:
      - a strictly newer external order observation is normalized at its source
        adapter boundary
      - Users resolves the exact external customer identity and retains the
        latest source snapshot without overriding explicit Pressly field
        authority
      - Orders retains the valid newer order observation separately from any
        canonical lifecycle adoption
      - before handoff, prospective source lifecycle may update or withdraw
        uncommitted demand under Orders policy
      - the first IN_PROGRESS-or-later non-canceled Cents observation may cross
        the one-way source-neutral fulfillment handoff
      - after handoff, later source lifecycle values remain audit metadata and
        cannot rewind, complete, cancel, withdraw, or otherwise change canonical
        Pressly lifecycle
      - an Orders outbox event applies fulfillment-keyed canonical demand
        changes to Production idempotently without carrying vendor lifecycle
        authority
      - physical bag intake may be recorded before release, but intake alone
        does not admit the production order
      - effective Production admission becomes released through canonical
        upstream fulfillment release or a current manual Production override
      - a manual override leaves source truth unchanged and becomes ready only
        when positive production demand and bag-count rules also hold
      - manual admission never selects or places an order, and executable
        scheduling reads only explicitly selected ready production orders
      - a pre-handoff source withdrawal may supersede a still-prospective manual
        override, while physically received or committed Pressly work is
        preserved
      - Processor floor views derive attention and actions from canonical
        Pressly state; downstream source differences remain integration and
        audit context
    status: active
    sources:
      - memdelta-2026-07-18-demand-lifecycle-outlook
      - memdelta-2026-07-20-source-neutral-order-boundary
      - memdelta-2026-07-26-manual-production-admission
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
  - id: production_order_resolution
    steps:
      - a manager requests a bounded backlog preview or reviews one order
      - the server classifies current eligibility and safety facts under the
        Production scheduling lock
      - the Production resolution graph decides resolve_without_production from
        open or restore from resolved_without_production
      - the current lifecycle projection and sanitized audit event are persisted
        atomically with version and idempotency evidence
      - resolved work is excluded from operational projections, counts, and
        forward actions while History retains its resolution evidence
      - an explicit manager restore re-reads current source-owned demand, due,
        provenance, admission, and phase facts before reopening the work
    status: active
    sources:
      - memdelta-2026-07-27-production-order-resolution
invariants:
  - id: orders_do_not_split_across_batches
    statement:
      A production_order can belong to at most one active production_batch,
      every queued rebatch or in-flight route moves the complete order
      atomically, and all bags remain with that order.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-15-order-control-history
  - id: bags_not_assigned_to_machines
    statement:
      Individual bags are not assigned to machines in v1; machine use is
      modeled at the stage level.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: batch_is_not_machine_load
    statement: A production_batch is a group of orders moving together through
      production, not a washer load or dryer load.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: batch_single_active_stage
    statement: A production_batch can be active in only one stage at a time.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: one_active_batch_per_stage_kind_v1
    statement:
      For v1, at most one production_batch can have an active stage_run for
      the same stage kind.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: stage_order_is_sequential
    statement:
      A stage cannot start before the previous required stage for the same
      production_batch is completed.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: machines_do_not_overlap
    statement: A machine cannot have overlapping active stage_machine_assignments.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: batch_minutes_minimum
    statement: batch_minutes must be at least 50.
    status: deprecated
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: schedule_run_is_immutable
    statement: A schedule_run input snapshot, output plan, hashes, algorithm
      version, score, and warnings are immutable after creation.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: one_production_run_per_schedule
    statement: Accepting a schedule_run creates exactly one production_run.
    status: deprecated
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: scheduler_does_not_mutate_execution
    statement: The scheduler returns proposals and cannot mutate execution state directly.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: stage_completion_is_operator_confirmed
    statement: stage_run completion is operator-confirmed operational truth, not
      washer or dryer hardware-confirmed truth.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: webhooks_are_idempotent
    statement: Inbound CRM webhook events must be idempotent.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: every_stage_occupies_one_pulse
    statement: The scheduler reserves exactly one scheduler_config.pulse_minutes
      planned window for sorting, washing, drying, and folding_packaging for
      every production_batch; the window is a forecast and resource reservation,
      while confirmed actual floor timing may differ without rewriting the
      accepted plan.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
      - memdelta-2026-07-15-operator-workspace-live-sync
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: batches_advance_only_on_pulse_boundaries
    statement:
      A production_batch cannot begin its next stage before that stage's
      planned pulse boundary; confirmed early physical completion may record the
      prior stage's truth but cannot pull downstream start times forward.
    status: deprecated
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: pulse_capacity_is_the_stage_bottleneck
    statement: pulse_capacity_lbs equals the minimum of total active washer
      effective capacity, total active dryer effective capacity, and
      fold_lbs_per_folder_minute multiplied by effective_folder_count and
      pulse_minutes.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: empty_pipeline_makespan
    statement: For the four-stage empty pipeline, makespan_minutes equals
      (actual_batch_count + 4 - 1) multiplied by pulse_minutes.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: oversized_orders_are_unplaced_v1
    statement: A production_order heavier than pulse_capacity_lbs is returned as
      unplaced in v1 and is never silently split.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: schedule_proposals_are_deterministic
    statement: The same selected ready-order snapshot, resource snapshot,
      scheduler_config version, and operator directives produce the same
      schedule proposal.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
      - memdelta-2026-07-19-shift-order-selection
  - id: production_run_starts_before_stages
    statement: A stage_run cannot start until its owning production_run is started.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
  - id: cents_projection_source_version_serialized
    statement:
      Concurrent Cents projections for one external order are serialized,
      and only a strictly newer vendor source version may replace the current
      projection.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
  - id: one_production_run_per_shift
    statement:
      Exactly one production_run may exist for one production shift, and
      Start is the only lifecycle transition that creates it.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: new_production_run_begins_started
    statement:
      A newly created production_run begins directly in started execution;
      planned is retained only as a legacy-readable state for pre-migration
      history.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: accept_does_not_create_execution
    statement: Accept records preference for the current immutable schedule_run
      revision and acknowledged warnings; it creates no production_run, batch,
      stage, assignment, or scheduled-order transition.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: one_current_schedule_revision_per_shift
    statement: A production shift has at most one current draft or accepted
      schedule_run revision; every successful Compute supersedes the previous
      current revision and revokes its acceptance.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: start_requires_current_accepted_snapshot
    statement: Start succeeds only when the accepted schedule_run is still the
      current revision and its exact selected ready-order snapshot is unchanged.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
      - memdelta-2026-07-19-shift-order-selection
  - id: post_start_orders_enter_existing_run
    statement: An order that becomes eligible after Start may enter only the
      existing production_run for its shift; LPMS never creates a sibling run
      for the arrival.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: batch_membership_freeze_is_orthogonal
    statement:
      Batch execution status and membership mutability are separate; queued
      membership may be mutable or explicitly frozen, while every non-queued
      batch is permanently frozen.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: online_insertion_has_zero_automatic_recourse_v1
    statement:
      V1 automatic live placement may place only the arriving order and may
      not relocate any existing production_order between batches.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: pulse_capacity_is_hard
    statement:
      Neither automatic placement, manager-exact placement, nor overtime
      acceptance may make a production_batch exceed pulse_capacity_lbs.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: queue_composition_is_versioned
    statement:
      Every committed queue-composition or membership mutation compares the
      expected production_run queue version and increments it exactly once.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: overtime_acceptance_is_version_bound
    statement:
      Overtime acceptance applies only to the exact placement proposal hash
      and queue version that the manager reviewed; any later queue change
      invalidates it.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: eligible_snapshot_mutations_are_serialized_v1
    statement:
      Compute, Accept, Start, and demand, intake, or priority commands that
      can change the eligible-order snapshot serialize per location before
      validating or mutating that snapshot.
    status: deprecated
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: pending_live_placement_is_durable_v1
    statement: When live placement cannot commit because confirmation or a
      recoverable condition is required, the production_order remains eligible
      and its pending placement outcome is durable and reloadable from the
      backend.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: inactive_batch_membership_history_is_retained_v1
    statement:
      Completing production deactivates current batch membership without
      deleting its historical production_batch_order record.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: shift_planning_commands_respect_operating_window_v1
    statement:
      Compute and Accept are allowed only before the production shift ends,
      while Start is allowed only at or after shift start and before shift end.
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: prestart_shift_changes_revoke_current_plan_v1
    statement:
      Before a production run exists, a versioned material change to shift
      start, end, or effective folder count atomically supersedes the current
      schedule and revokes acceptance; after a run exists the shift is not
      mutable.
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: early_stage_completion_is_confirmation_bound_v1
    statement:
      Completing a started stage before the later of its planned end and
      actual start plus one pulse requires an actor-bound, stage-version-bound,
      timing-bound confirmation that is revalidated and audited with the
      transition.
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: final_batch_completion_closes_run_and_shift_v1
    statement: Completing the final folding_packaging stage terminalizes its
      assignments, orders, bags, active memberships, and batch and, when every
      run batch is finished, completes the production_run and closes its
      production shift in the same transaction.
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: production_live_revision_is_work_event_bound_v1
    statement:
      Every committed location-owned production work_event advances that
      location's durable live revision exactly once in the same transaction;
      notification is an invalidation hint rather than production truth.
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: planned_stage_windows_are_advisory_reservations_v1
    statement:
      Planned stage windows coordinate expected flow and reserve resources,
      but an otherwise-valid operator-confirmed early start or completion may
      record actual floor truth without mutating those planned boundaries.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: early_stage_start_is_confirmation_bound_v1
    statement: Starting a stage before planned_start_at succeeds only when every
      other transition invariant holds and an actor-bound, stage-version-bound,
      timing-bound confirmation is revalidated and audited with the transition.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: stage_boundary_provenance_is_explicit_v1
    statement: Every actual stage boundary is classified as live_observed,
      operator_reported, or not_recorded; a missed boundary remains null and
      not_recorded rather than receiving an inferred timestamp.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: reconciled_batch_start_is_a_recorded_lifecycle_anchor_v1
    statement: When floor reconciliation first moves a queued production_batch
      forward, started_at records the reconciliation commit time when LPMS
      learned that execution had begun; it is not a reconstructed physical
      stage-start timestamp, and any skipped stage boundary remains
      not_recorded.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: floor_progress_reconciliation_is_forward_only_v1
    statement:
      Floor progress reconciliation may move one coherent started-run batch
      only to a strictly later canonical milestone; backward correction and
      reopening are separate deferred workflows.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: floor_progress_reconciliation_preserves_unknown_boundaries_v1
    statement: Reconciliation records the current milestone without inventing
      timestamps, stage events, or historical machine assignments for work that
      LPMS did not observe; a skipped stage's planned assignment is removed from
      the mutable execution projection while its immutable schedule and stage
      window retain the plan.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: floor_progress_reconciliation_is_atomic_v1
    statement: A confirmed floor reconciliation compares the expected run queue
      version, batch version, and all four stage versions, updates the complete
      current projection atomically, increments queue composition at most once
      when required, and appends exactly one batch_progress_reconciled
      work_event.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: floor_progress_reconciliation_terminalization_parity_v1
    statement:
      Reconciliation to finished uses the same terminalization operation as
      live final-stage completion for assignments, orders, bags, active
      memberships, batch, run, and shift.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: whole_order_routing_is_atomic_v1
    statement:
      A committed order route atomically releases the source membership and
      unfinished attempts, creates one target membership and required target
      attempts, updates source and target aggregate weights, compares and
      increments the relevant queue, batch, and order versions, invalidates
      stale overtime acceptance, and appends exactly one routing work_event.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: batch_stage_transition_has_one_authority_v1
    statement: Canonical production_batch and stage_run progression changes only
      through the existing stage advance or floor-reconciliation authorities;
      order routing and production_order_stage_attempt records cannot
      independently start, complete, rewind, or finish a batch stage.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: order_stage_attempt_assignment_is_immutable_v1
    statement: A production_order_stage_attempt retains its order, canonical
      stage_run, stage kind, attempt number, and assignment reason; completion
      or release terminalizes that assignment, and later routing creates a new
      numbered attempt instead of rewriting prior route history.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: in_flight_order_route_moves_later_v1
    statement:
      An in-flight defer or rework route may target only a strictly later
      production_batch, may not skip the current or requested restart work, and
      must fit the complete order within hard capacity for every newly assigned
      target stage.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: source_lifecycle_does_not_advance_floor_truth_v1
    statement:
      An external lifecycle observation may update retained source metadata
      and source-owned demand fields, but it cannot start, advance, finish,
      cancel, rewind, delete, resolve, restore, reopen, or otherwise change an
      LPMS order, batch, stage, run, shift, or Production resolution lifecycle;
      after handoff its lifecycle value is observation-only and cannot resurrect
      resolved Production work.
    status: active
    sources:
      - memdelta-2026-07-18-demand-lifecycle-outlook
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
      - memdelta-2026-07-27-production-order-resolution
  - id: physical_intake_can_admit_lagging_source_v1
    statement: Physical intake with a recorded bag count may admit expected or
      inbound demand to Production when weight and eligibility rules hold even
      if the latest Cents status has not reached IN_PROGRESS.
    status: deprecated
    sources:
      - memdelta-2026-07-18-demand-lifecycle-outlook
  - id: committed_work_survives_source_withdrawal_v1
    statement: A downstream or canceled source observation cannot remove or
      terminalize physically received, selected, scheduled, batched, active, or
      finished Pressly work; the observation remains integration and audit
      context without creating a production-floor comparison task.
    status: active
    sources:
      - memdelta-2026-07-18-demand-lifecycle-outlook
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
  - id: advisory_demand_forecast_is_non_executable_v1
    statement:
      The shift demand forecast is deterministic, read-only, weight-only,
      and non-persistent; it cannot be accepted or started and it never
      fabricates bag counts or changes the executable scheduling snapshot.
    status: deprecated
    sources:
      - memdelta-2026-07-18-demand-lifecycle-outlook
  - id: finished_work_excluded_from_forward_demand_v1
    statement:
      Finished Pressly orders are excluded from remaining-day order counts,
      weight totals, capacity risk, and forecast groups, while their latest
      source observations remain available in audit and integration history.
    status: active
    sources:
      - memdelta-2026-07-19-demand-outlook-correctness
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
  - id: pre_release_intake_does_not_admit_v1
    statement: Physical bag intake alone never admits pre-release demand to
      executable Production; effective admission requires canonical upstream
      release or a current manual Production override, and readiness still
      requires positive production demand and recorded bag intake.
    status: active
    sources:
      - memdelta-2026-07-19-shift-order-selection
      - memdelta-2026-07-26-manual-production-admission
  - id: selected_snapshot_mutations_are_serialized_v1
    statement: Compute, Accept, Start, shift selection, and demand, intake, or
      priority commands that can change a selected scheduling snapshot serialize
      per location before validating or mutating that snapshot.
    status: active
    sources:
      - memdelta-2026-07-19-shift-order-selection
  - id: production_demand_is_fulfillment_keyed_v1
    statement:
      Production demand is keyed by a canonical fulfillment identity and
      cannot use a vendor source key as its business identity.
    status: active
    sources:
      - memdelta-2026-07-20-source-neutral-order-boundary
  - id: manual_admission_preserves_source_truth_v1
    statement: Manual Production admission changes only effective Production
      eligibility and never mutates canonical fulfillment release, vendor
      lifecycle status, or the latest source observation.
    status: active
    sources:
      - memdelta-2026-07-26-manual-production-admission
  - id: manual_admission_does_not_select_or_place_v1
    statement: Manual Production admission never selects an order for a shift,
      commits it to a schedule, or places it into a production batch or run.
    status: active
    sources:
      - memdelta-2026-07-26-manual-production-admission
  - id: source_withdrawal_supersedes_manual_admission_v1
    statement:
      Source withdrawal supersedes a manual Production admission override
      as the effective admission signal, while physically received or committed
      LPMS work remains preserved under the existing reconciliation policy.
    status: deprecated
    sources:
      - memdelta-2026-07-26-manual-production-admission
  - id: remaining_day_outlook_is_non_executable_v1
    statement: The remaining-day outlook is deterministic, read-only, and
      non-persistent; it includes current Pressly execution and placement state
      but cannot accept, start, select, place, or mutate work and never
      fabricates bag counts, shifts, batches, physical progress, or completion
      times.
    status: active
    sources:
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
  - id: pre_handoff_source_withdrawal_supersedes_prospective_admission_v1
    statement: Before the source handoff, source withdrawal may supersede a
      still-prospective manual Production admission override; it cannot erase
      physically received, selected, scheduled, batched, active, or finished
      Pressly work.
    status: active
    sources:
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
  - id: resolved_without_production_is_not_execution_v1
    statement: Resolving a Production order without production never means
      scheduled, batched, started, finished, physically completed, canceled in a
      source system, deleted, or otherwise advanced through the execution
      lifecycle.
    status: active
    sources:
      - memdelta-2026-07-27-production-order-resolution
  - id: resolved_work_is_excluded_from_forward_operations_v1
    statement:
      A Production order in resolved_without_production remains retained
      and auditable but is excluded from operational actions, active order
      counts, scheduling, placement, routing, intake, admission, production
      workspaces, and remaining-day demand until an explicit valid restore
      reopens it.
    status: active
    sources:
      - memdelta-2026-07-27-production-order-resolution
policies:
  - id: cents_in_progress_is_eligible
    statement:
      A Cents order becomes an LPMS-ready candidate only when its latest
      projected phase is production_released, its production estimate is
      positive, and physical bag intake is recorded.
    status: deprecated
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-19-shift-order-selection
  - id: cents_weight_derivation_v1
    statement: For v1, LPMS derives production weight from Cents laundry service
      pricing instead of measured bag-level weight.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: wash_fold_only_v1
    statement: V1 is scoped to wash-and-fold production only.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: heijunka_pulse_v1
    statement: V1 uses deterministic heijunka-style leveling with configurable
      pulse_minutes; initial planning uses 56 minutes rather than deriving a
      stage duration.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: washer_effective_capacity
    statement:
      Washer scheduling uses effective capacity below manufacturer capacity
      to preserve cleaning quality.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: no_hardware_integration_v1
    statement: V1 has no washer or dryer hardware integration; operators confirm
      starts and completions manually.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: due_bucket_selection_v1
    statement:
      V1 production views classify unfinished work due before the current
      calendar day as overdue, followed by due-today, due-tomorrow, and later
      buckets; finished work is presented as finished rather than as outstanding
      overdue work while retaining its original due timestamp.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-19-demand-outlook-correctness
  - id: consistency_over_availability
    statement: Production writes prefer consistency over availability.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: greedy_scheduler_before_optimization_v1
    statement: V1 uses a deterministic and explainable greedy packing heuristic
      rather than claiming combinatorial optimality; deeper optimization
      requires operational evidence.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: priority_means_earliest_feasible_batch
    statement:
      A priority production_order is placed in its earliest feasible batch
      ahead of non-priority peers, subject to eligibility, pulse capacity, and
      whole-order constraints; priority does not guarantee batch one.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: future_order_pull_forward_requires_horizon
    statement:
      Future-due production_orders may fill unused capacity only within an
      explicit operator-selected planning horizon, and pulling them forward does
      not change their due dates.
    status: deprecated
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: prestart_planning_includes_all_eligible_orders
    statement: Before Start, Compute includes every currently eligible
      production_order for the shift rather than an operator-selected planning
      horizon.
    status: deprecated
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: priority_live_placement_v1
    statement:
      A priority arrival uses the earliest feasible mutable queued batch;
      if none fits, LPMS creates a batch after frozen or in-flight anchors and
      existing priority work but before the remaining ordinary mutable suffix.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: ordinary_live_placement_v1
    statement:
      An ordinary arrival uses the best-fitting mutable queued batch with
      earliest sequence as the tie-breaker; if none fits, LPMS appends a new
      batch.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: manager_exact_batch_placement_v1
    statement:
      An authorized manager may pin an arriving order to an exact requested
      mutable queued batch when the placement satisfies hard physical
      constraints; LPMS must not silently substitute another batch.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: overtime_requires_explicit_acceptance
    statement:
      A placement projected beyond the shift end is shown as an overflowing
      plan and commits only after an authorized manager explicitly accepts that
      exact overtime outcome.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: human_stability_is_a_scheduling_objective
    statement:
      Scheduling decisions balance priority and tardiness, overtime, pulse
      utilization, and the recourse or churn imposed on floor workers; packing
      efficiency alone is insufficient.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
  - id: schedule_actionability_is_run_provenance_aware_v1
    statement:
      A draft or accepted schedule is actionable only while its shift is
      open and unexpired and no production_run uses that schedule as provenance;
      run-owned, closed, and expired contexts are read-only history.
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: floor_progress_reconciliation_preserves_hard_constraints_v1
    statement:
      Floor reconciliation cannot override stage sequence, one active batch
      per stage kind, machine compatibility, active-machine availability,
      machine non-overlap, whole-batch membership, or hard effective capacity
      constraints.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: queued_order_rebatch_v1
    statement: A queued whole-order move is allowed only from an unfrozen queued
      source to the exact employee-selected mutable queued target; LPMS rejects
      the move rather than substituting another batch.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: in_flight_order_defer_or_rework_v1
    statement:
      A started but unfinished whole order may be left behind or assigned
      bounded rework by releasing its unfinished source-stage attempts and
      assigning the required stage suffix in a later batch while preserving
      completed attempts as history.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: earliest_feasible_later_order_route_v1
    statement:
      For an in-flight defer or rework command, LPMS chooses the earliest
      stable later batch whose required stage suffix remains planned and whose
      per-stage assigned load can accept the complete order without exceeding
      hard capacity.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: cents_lifecycle_phase_mapping_v1
    statement:
      SUBMITTED and READY_FOR_PICKUP are expected, PICKED_UP is inbound,
      IN_PROGRESS is production released, READY_FOR_RETURN, OUT_FOR_DELIVERY,
      and COMPLETED are post-production comparison signals, and canceled is
      withdrawn.
    status: deprecated
    sources:
      - memdelta-2026-07-18-demand-lifecycle-outlook
  - id: service_day_demand_horizon_v1
    statement: The remaining-day horizon is the selected local service day and
      includes overdue unfinished work, unfinished work due before that local
      day ends, and work already admitted or executing for that day; later
      demand is outside the outlook.
    status: active
    sources:
      - memdelta-2026-07-18-demand-lifecycle-outlook
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
  - id: shift_order_selection_is_explicit_v1
    statement:
      Ready candidates are unselected by default and Compute includes only
      the complete server-authoritative order set explicitly selected for that
      production shift by an authorized manager.
    status: active
    sources:
      - memdelta-2026-07-19-shift-order-selection
  - id: post_start_arrival_requires_manager_placement_v1
    statement: An order becoming ready after Start remains outside the existing
      production run until an authorized manager explicitly requests placement;
      webhook projection and physical intake never place it silently.
    status: active
    sources:
      - memdelta-2026-07-19-shift-order-selection
  - id: released_fulfillment_is_eligible_v1
    statement:
      A fulfillment becomes an LPMS-ready candidate only when its effective
      Production admission is released through canonical upstream release or a
      current manual Production override, its production estimate is positive,
      and physical bag intake is recorded.
    status: active
    sources:
      - memdelta-2026-07-20-source-neutral-order-boundary
      - memdelta-2026-07-26-manual-production-admission
  - id: source_lifecycle_mapping_lives_upstream_v1
    statement: Vendor lifecycle codes are normalized into commercial lifecycle,
      fulfillment release, and comparison metadata before Production; Production
      never interprets a vendor status string.
    status: active
    sources:
      - memdelta-2026-07-20-source-neutral-order-boundary
  - id: manual_admission_reversal_is_precommit_only_v1
    statement: Manual Production admission may be reversed only before shift
      selection, scheduling commitment, or production-batch assignment, with
      availability revalidated under the location scheduling lock.
    status: active
    sources:
      - memdelta-2026-07-26-manual-production-admission
  - id: manual_admission_is_location_authorized_v1
    statement: Owner, administrator, and operator roles may manually release or
      reverse Production admission only within a location they are authorized to
      operate.
    status: active
    sources:
      - memdelta-2026-07-26-manual-production-admission
  - id: remaining_day_outlook_partition_v1
    statement:
      The remaining-day outlook partitions unfinished work into the active
      production run, ready work that the server can currently place, expected
      work that is not yet executable, and work that needs another shift or
      remains unassigned today; appendability uses the same server-authoritative
      hard-capacity and placement rules as execution.
    status: active
    sources:
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
  - id: production_order_resolution_lifecycle_v1
    statement: Production-order resolution is governed by the explicit
      open-to-resolved_without_production and
      resolved_without_production-to-open graph; manager authorization, current
      operational guards, expected version, idempotency, audit, and location
      serialization must succeed around the graph decision, and selected,
      scheduled, batched, active, routed, reconciled, finished, or historically
      participating work cannot use backlog cleanup.
    status: active
    sources:
      - memdelta-2026-07-27-production-order-resolution
decisions:
  - id: domain_named_laundry_production
    statement: The durable Stateworks memory domain is named laundry-production
      instead of lpms because LPMS is the app/system name.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: schedule_run_is_proposal
    statement: schedule_run represents a scheduler proposal, not real
      production-floor execution.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: production_run_is_execution_truth
    statement:
      production_run is the sole live execution aggregate for a shift and
      is created at Start, while schedule_run revisions remain pre-start
      proposals and audit history.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-14-run-centered-online-scheduling
  - id: stage_run_owns_floor_state
    statement: stage_run rows own the current physical workflow projection and
      remain the sole batch-stage transition authority;
      production_order_stage_attempt rows record per-order participation and
      routing history against those canonical stages but cannot advance
      execution.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-15-floor-truth-reconciliation
      - memdelta-2026-07-15-order-control-history
  - id: work_event_not_full_event_sourcing_v1
    statement:
      work_event is the authoritative mutation ledger and audit trail, but
      LPMS is not full event sourcing in v1.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: typescript_scheduler_first
    statement:
      Build the first scheduler in TypeScript behind a boundary that can
      later be replaced by a Rust solver.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: memory_keeps_rules_docs_keep_schema
    statement:
      Stateworks memory stores durable business rules; docs/plan/lpms.md
      stores richer schema and modeling detail.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: happy_path_delivery_before_exceptions
    statement: The happy path was delivered before exceptions; the first bounded
      exception slice now supports queued whole-order rebatching and in-flight
      defer or rework, while generic holds, cancellations, damage, missing
      items, and backward correction remain separate workflows.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
      - memdelta-2026-07-15-order-control-history
  - id: fixed_pulse_scheduler_ordering_v1
    statement:
      V1 orders scheduling candidates by priority, due-date bucket, weight
      descending, due timestamp, and stable production_order ID before
      whole-order first-fit-decreasing packing.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
  - id: durable_inbox_worker_v1
    statement: V1 processes Cents demand from a Postgres inbox with SKIP LOCKED
      claims, expiring leases, bounded retry backoff, inspectable dead letters,
      and an explicit reconciliation port.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
  - id: processor_uses_backend_action_availability
    statement: The Processor renders Production action availability and backlog
      classification from server-owned lifecycle graphs and policies, including
      stage, admission, archive, restore, and bounded bulk-review actions, and
      does not recreate lifecycle transitions, cleanup eligibility, source
      comparison, placement, or forecast classification in the browser.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
      - memdelta-2026-07-26-manual-production-admission
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
      - memdelta-2026-07-27-production-order-resolution
  - id: isolated_lpms_module_composition
    statement: Users, Orders, Production business, Production policy, and
      fixed-pulse scheduling are isolated peer modules composed through narrow
      ports only in API and Worker applications.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
      - memdelta-2026-07-20-source-neutral-order-boundary
  - id: online_scheduling_uses_bounded_recourse
    statement:
      LPMS treats post-start arrivals as an online scheduling problem with
      frozen work as irrevocable, zero automatic recourse in v1, and explicit
      human overrides as durable constraints.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: offline_optimum_is_a_benchmark
    statement: Offline optimal schedules and competitive analysis are evaluation
      tools for LPMS algorithms, not authority to silently rewrite the live
      physical queue.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
  - id: backend_owns_workspace_identity
    statement: Shift, current-plan, production-run, queue-version, action
      availability, and historical status come from backend state and explicit
      resource identifiers rather than temporary Processor state, query-owned
      navigation, automatic invalid-path redirects, or arbitrary
      overlapping-shift selection.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: defer_sse_until_state_contract_is_stable
    statement:
      Immediate refresh and bounded polling are sufficient for this work;
      SSE is deferred until run-centered identity and state transitions are
      correct.
    status: deprecated
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: defer_probabilistic_stability_score_v1
    statement:
      V1 does not use an arbitrary or probabilistic 0-to-1 stability value;
      any later stability term must be an evidence-backed scoring penalty rather
      than randomness.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
  - id: defer_silent_live_reoptimization_v1
    statement: V1 does not silently repack the live queued suffix; a future
      optimizer may only preview bounded moves and requires explicit manager
      acceptance before mutation.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: run_centered_algorithms_implemented_v1
    statement: The implemented pre-start planner is fixed-pulse-ffd-v2 and the
      implemented post-start pure placement computation is
      online-stable-insertion-v1.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: run_centered_forward_migration_v1
    statement: Migration 0016 aborts before mutation on duplicate shift runs or
      inconsistent execution, normalizes legacy planned runs back to accepted
      plans, enforces one current plan and one run per shift, and adds queue,
      freeze, placement-provenance, and v2 scheduler facts.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: processor_run_centered_polling_v1
    statement: The Processor persists shiftId and runId in the URL, refreshes
      authoritative backend state after commands, and polls visible online
      workspaces and boards every ten seconds without SSE.
    status: deprecated
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
  - id: processor_uses_sse_invalidation_v1
    statement:
      The Processor uses an authenticated per-location SSE revision stream
      to invalidate and coalesce authoritative workspace or board reads;
      streamed payloads never become a second source of production state and
      timer polling is not used for production synchronization.
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: worker_inbox_polling_remains_intentional_v1
    statement:
      The private Worker continues bounded durable-inbox claim polling with
      idle waits, retry backoff, lease fencing, heartbeat, and separately
      throttled backlog sampling; this job-execution loop is independent of
      Processor live synchronization.
    status: active
    sources:
      - memdelta-2026-07-15-operator-workspace-live-sync
  - id: floor_recovery_is_not_offline_first_v1
    statement:
      V1 floor recovery operates only after the backend is reachable and
      reconciles already-advanced physical reality; the Processor does not queue
      offline production commands, predict success while disconnected, or replay
      browser writes later.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: defer_backward_floor_correction_and_reopen_v1
    statement:
      Backward stage correction and reopening completed stages, batches,
      runs, or shifts require a separate exception and compensation model and
      are deferred.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: defer_offline_command_queue_and_pwa_v1
    statement:
      A true offline command log, PWA execution mode, replay protocol, and
      conflict-resolution experience are deferred rather than approximated by
      forward reconciliation.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: defer_concurrent_same_kind_execution_v1
    statement: V1 retains at most one active production_batch per stage kind;
      redesigning capacity and operator coordination for concurrent same-kind
      execution is deferred.
    status: active
    sources:
      - memdelta-2026-07-15-floor-truth-reconciliation
  - id: server_paginated_order_home_and_history_v1
    statement:
      The Processor root is an order-first Home surface and /history is a
      read-only production audit surface; both use bounded server keyset
      pagination and server-side filters rather than loading an unbounded
      location history into browser state.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: sanitized_history_projection_v1
    statement:
      Public production history exposes typed event summaries and selected
      operational detail only; raw work_event payloads and private idempotency
      records remain internal, and run detail activity is capped with an
      explicit continuation signal.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: defer_sole_order_empty_batch_routing_v1
    statement: V1 rejects routing the only active order out of a source batch
      because empty-batch retention or deletion, queue resequencing, planned
      reservation cleanup, in-flight compensation, and completion effects
      require an explicit separate policy.
    status: active
    sources:
      - memdelta-2026-07-15-order-control-history
  - id: source_floor_mismatch_requires_operator_confirmation_v1
    statement: Because Cents and LPMS are independent systems connected by the
      webhook, a lifecycle disagreement is surfaced for comparison and LPMS
      requires operator confirmation against physical truth before changing
      canonical floor progression.
    status: deprecated
    sources:
      - memdelta-2026-07-18-demand-lifecycle-outlook
  - id: production_reads_do_not_own_user_or_order_data
    statement:
      Processor views may compose User, Order, and Production facts, but
      Production persists only the demand and floor facts required for laundry
      execution.
    status: active
    sources:
      - memdelta-2026-07-20-source-neutral-order-boundary
  - id: production_owns_manual_admission_override_v1
    statement: Production owns the source-neutral manual admission override and
      applies versioned, idempotent, actor-audited, location-authorized commands
      under the same location scheduling lock used by planning.
    status: active
    sources:
      - memdelta-2026-07-26-manual-production-admission
  - id: persistent_production_lifecycles_use_authoritative_graphs_v1
    statement: Each persistent Production aggregate lifecycle, including the
      execution, admission, and orthogonal production-order resolution
      lifecycles, is governed by one authoritative explicit state-and-event
      graph; cross-aggregate use cases orchestrate graph decisions and effects,
      local adapters and repositories cannot define parallel transitions,
      derived operational and forecast values remain pure projections, and no
      global workflow engine is introduced.
    status: active
    sources:
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
      - memdelta-2026-07-27-production-order-resolution
  - id: processor_forecast_surface_owns_remaining_day_detail_v1
    statement:
      The Processor exposes detailed remaining-day planning at /forecast,
      keeps Home to a compact operational summary and link, and keeps Schedule
      focused on scheduling-ready orders with only bounded forecast context.
    status: active
    sources:
      - memdelta-2026-07-26-operational-truth-remaining-day-outlook
  - id: production_order_archive_is_nondestructive_resolution_v1
    statement:
      Processor Archive from active work is the manager-facing presentation
      of Production resolved_without_production; records and sanitized History
      are retained, work is not marked produced, routine hard deletion is not
      introduced, and restoration is a separate explicit graph transition.
    status: active
    sources:
      - memdelta-2026-07-27-production-order-resolution
assumptions:
  - id: cents_price_weight_good_enough_v1
    statement: Cents price-derived weight is good enough for first-version scheduling.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
    confidence: medium
  - id: initial_fold_rate
    statement:
      Initial planning uses 2 pounds per effective folder minute, but the
      value remains configurable and must later be calibrated from observed
      production data.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
    confidence: medium
  - id: commercial_orders_low_volume_v1
    statement:
      Commercial orders are low enough volume in v1 to stay inside the same
      simple batching model.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
    confidence: medium
  - id: manual_stage_confirmation_is_acceptable_v1
    statement: Manual operator confirmation is acceptable as the source of stage
      completion truth in v1.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
    confidence: high
  - id: manager_maps_to_owner_admin_v1
    statement: Existing owner and admin application roles act as the
      laundry-production manager for Accept, Start, exact placement, queued
      unfreeze, and overtime acceptance in v1.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
    confidence: medium
  - id: queued_unfreeze_is_manager_only_v1
    statement: A still-queued frozen batch may be explicitly unfrozen only by an
      owner or admin, with confirmation and audit; a non-queued batch can never
      be unfrozen.
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
      - memdelta-2026-07-14-run-centered-online-scheduling-implementation
    confidence: medium
open_questions:
  - id: exact_scheduler_ordering_rules
    question:
      What stable tie-breakers should order candidates with equal priority,
      due-date bucket, and packing rank?
    status: deprecated
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: exception_effects
    question:
      How should manual holds, hard-confirmed cancellations, damaged items,
      missing bags, and empty source batches affect an accepted production_run
      and its planned resource reservations?
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
      - memdelta-2026-07-15-order-control-history
  - id: role_permission_mapping
    question:
      Does the v1 owner/admin-as-manager mapping match floor authority for
      Accept, Start, exact placement, queued unfreeze, and overtime acceptance?
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-14-run-centered-online-scheduling
  - id: production_shift_boundaries
    question: How should production shifts constrain schedule generation,
      continuation, and completion?
    status: deprecated
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: replan_after_drift
    question:
      When execution drifts from a schedule, should LPMS preserve the old
      plan, replan remaining batches, or create a new schedule_run?
    status: deprecated
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: queued_unfreeze_authorization
    question:
      Should a still-queued frozen batch be allowed to be unfrozen, and if
      so is owner/admin-only authorization correct?
    status: active
    sources:
      - memdelta-2026-07-14-run-centered-online-scheduling
