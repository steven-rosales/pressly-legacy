domain_id: laundry-production
name: Laundry Production
version: 4
status: active
summary: >
  Durable business memory for Pressly's wash-and-fold production process. LPMS
  is the product/system being built; laundry-production is the business domain.
actors:
  - id: operator
    description: A person using LPMS to execute or confirm production-floor work.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: manager
    description:
      A person who can create, review, accept, and supervise production
      schedules and runs.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: employee
    description:
      A production worker who performs sorting, washing, drying, folding,
      or packaging work.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
external_systems:
  - id: cents
    description: The v1 CRM/vendor system and external order authority for
      webhook-driven order demand.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
objects:
  - id: crm_order
    description:
      The normalized projection of a Cents order; it is external demand,
      not production truth.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: production_order
    description:
      The internal LPMS view of a CRM order that may become eligible for
      production scheduling.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: schedule_run
    description:
      An immutable scheduler proposal containing input snapshot, output
      plan, hashes, score, and warnings.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: production_run
    description: The accepted execution instance created from a schedule proposal.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: production_batch
    description: A real group of production orders moving together through the
      floor; it is not a washer load.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: stage_run
    description: The state-machine owner for one physical process step of one
      production batch.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: stage_machine_assignment
    description: A stage-level assignment of one physical machine to a stage run.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: machine
    description:
      A physical constrained production resource such as a washer, dryer,
      or folding station.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: scheduler_config
    description:
      Versioned configuration for pulse duration, folding rate, algorithm
      version, and scheduler behavior.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: work_event
    description: The authoritative mutation ledger and audit trail for production changes.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
states:
  schedule_run:
    - draft
    - accepted
    - superseded
    - rejected
  production_run:
    - planned
    - started
    - completed
    - canceled
  production_batch:
    - queued
    - sorting
    - washing
    - drying
    - folding_packaging
    - finished
    - canceled
    - blocked
  stage_run:
    - planned
    - started
    - completed
    - blocked
    - canceled
workflows:
  - id: production_batch_happy_path
    steps:
      - queued
      - sorting
      - washing
      - drying
      - folding_packaging
      - finished
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: scheduling_to_execution
    steps:
      - API durably receives a verified Cents event
      - worker projects the newest vendor source version
      - eligible production_orders form an immutable scheduling snapshot
      - deterministic scheduler creates a schedule_run proposal
      - operator acknowledges blocking warnings and accepts the output hash
      - LPMS creates one production_run and its batches, stages, assignments,
        and work_event atomically
      - operator starts the production_run
      - operators advance server-authorized stage_run actions at pulse boundaries
      - production_batch finishes folding and packaging
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-lpms-v1-implementation
  - id: production_command_write_path
    steps:
      - receive command
      - validate invariants
      - insert work_event
      - update operational tables
      - commit transaction
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: fixed_pulse_pipeline
    steps:
      - sorting for one pulse
      - washing for one pulse
      - drying for one pulse
      - folding_packaging for one pulse
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
invariants:
  - id: orders_do_not_split_across_batches
    statement:
      A production_order can belong to at most one active production_batch,
      and all bags for one order must stay in that same production_batch.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: bags_not_assigned_to_machines
    statement:
      Individual bags are not assigned to machines in v1; machine use is
      modeled at the stage level.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: batch_is_not_machine_load
    statement: A production_batch is a group of orders moving together through
      production, not a washer load or dryer load.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: batch_single_active_stage
    statement: A production_batch can be active in only one stage at a time.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: one_active_batch_per_stage_kind_v1
    statement:
      For v1, at most one production_batch can have an active stage_run for
      the same stage kind.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: stage_order_is_sequential
    statement:
      A stage cannot start before the previous required stage for the same
      production_batch is completed.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: machines_do_not_overlap
    statement: A machine cannot have overlapping active stage_machine_assignments.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: batch_minutes_minimum
    statement: batch_minutes must be at least 50.
    status: deprecated
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: schedule_run_is_immutable
    statement: A schedule_run input snapshot, output plan, hashes, algorithm
      version, score, and warnings are immutable after creation.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: one_production_run_per_schedule
    statement: Accepting a schedule_run creates exactly one production_run.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: scheduler_does_not_mutate_execution
    statement: The scheduler returns proposals and cannot mutate execution state directly.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: stage_completion_is_operator_confirmed
    statement: stage_run completion is operator-confirmed operational truth, not
      washer or dryer hardware-confirmed truth.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: webhooks_are_idempotent
    statement: Inbound CRM webhook events must be idempotent.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: every_stage_occupies_one_pulse
    statement:
      Sorting, washing, drying, and folding_packaging each occupy exactly
      one scheduler_config.pulse_minutes slot for every production_batch.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: batches_advance_only_on_pulse_boundaries
    statement:
      A production_batch advances only at pulse boundaries; early physical
      completion does not shorten a stage or move downstream start times.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: pulse_capacity_is_the_stage_bottleneck
    statement: pulse_capacity_lbs equals the minimum of total active washer
      effective capacity, total active dryer effective capacity, and
      fold_lbs_per_folder_minute multiplied by effective_folder_count and
      pulse_minutes.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: empty_pipeline_makespan
    statement: For the four-stage empty pipeline, makespan_minutes equals
      (actual_batch_count + 4 - 1) multiplied by pulse_minutes.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: oversized_orders_are_unplaced_v1
    statement: A production_order heavier than pulse_capacity_lbs is returned as
      unplaced in v1 and is never silently split.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: schedule_proposals_are_deterministic
    statement:
      The same eligible-order snapshot, resource snapshot, scheduler_config
      version, and operator directives produce the same schedule proposal.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: production_run_starts_before_stages
    statement: A stage_run cannot start until its owning production_run is started.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
  - id: cents_projection_source_version_serialized
    statement:
      Concurrent Cents projections for one external order are serialized,
      and only a strictly newer vendor source version may replace the current
      projection.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
policies:
  - id: cents_in_progress_is_eligible
    statement:
      A Cents order is eligible for LPMS production only when the latest
      projected CRM order status is IN_PROGRESS.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: cents_weight_derivation_v1
    statement: For v1, LPMS derives production weight from Cents laundry service
      pricing instead of measured bag-level weight.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: wash_fold_only_v1
    statement: V1 is scoped to wash-and-fold production only.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: heijunka_pulse_v1
    statement: V1 uses deterministic heijunka-style leveling with configurable
      pulse_minutes; initial planning uses 56 minutes rather than deriving a
      stage duration.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: washer_effective_capacity
    statement:
      Washer scheduling uses effective capacity below manufacturer capacity
      to preserve cleaning quality.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: no_hardware_integration_v1
    statement: V1 has no washer or dryer hardware integration; operators confirm
      starts and completions manually.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: due_bucket_selection_v1
    statement:
      V1 scheduling should expose due-today, due-tomorrow, and later order
      buckets for operator judgment.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: consistency_over_availability
    statement: Production writes prefer consistency over availability.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: greedy_scheduler_before_optimization_v1
    statement: V1 uses a deterministic and explainable greedy packing heuristic
      rather than claiming combinatorial optimality; deeper optimization
      requires operational evidence.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: priority_means_earliest_feasible_batch
    statement:
      A priority production_order is placed in its earliest feasible batch
      ahead of non-priority peers, subject to eligibility, pulse capacity, and
      whole-order constraints; priority does not guarantee batch one.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: future_order_pull_forward_requires_horizon
    statement:
      Future-due production_orders may fill unused capacity only within an
      explicit operator-selected planning horizon, and pulling them forward does
      not change their due dates.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
decisions:
  - id: domain_named_laundry_production
    statement: The durable Stateworks memory domain is named laundry-production
      instead of lpms because LPMS is the app/system name.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: schedule_run_is_proposal
    statement: schedule_run represents a scheduler proposal, not real
      production-floor execution.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: production_run_is_execution_truth
    statement: production_run and its production_batch and stage_run records
      represent accepted execution truth.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: stage_run_owns_floor_state
    statement: stage_run owns the physical workflow state machine.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: work_event_not_full_event_sourcing_v1
    statement:
      work_event is the authoritative mutation ledger and audit trail, but
      LPMS is not full event sourcing in v1.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: typescript_scheduler_first
    statement:
      Build the first scheduler in TypeScript behind a boundary that can
      later be replaced by a Rust solver.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: memory_keeps_rules_docs_keep_schema
    statement:
      Stateworks memory stores durable business rules; docs/plan/lpms.md
      stores richer schema and modeling detail.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: happy_path_delivery_before_exceptions
    statement: Deliver the happy path through the API and scheduler, processor
      integration, and UI before implementing manual holds, hard-confirmed
      cancellation, recovery, and exception UX from observed workflows.
    status: active
    sources:
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: fixed_pulse_scheduler_ordering_v1
    statement:
      V1 orders scheduling candidates by priority, due-date bucket, weight
      descending, due timestamp, and stable production_order ID before
      whole-order first-fit-decreasing packing.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
  - id: durable_inbox_worker_v1
    statement: V1 processes Cents demand from a Postgres inbox with SKIP LOCKED
      claims, expiring leases, bounded retry backoff, inspectable dead letters,
      and an explicit reconciliation port.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
  - id: processor_uses_backend_action_availability
    statement:
      The LPMS processor renders stage actions returned by the production
      API and does not recreate stage-transition policy in the browser.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
  - id: isolated_lpms_module_composition
    statement:
      Production business, production policy, and fixed-pulse scheduling
      are isolated peer modules composed through narrow ports only in API and
      worker apps.
    status: active
    sources:
      - memdelta-2026-07-10-lpms-v1-implementation
assumptions:
  - id: cents_price_weight_good_enough_v1
    statement: Cents price-derived weight is good enough for first-version scheduling.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
    confidence: medium
  - id: initial_fold_rate
    statement:
      Initial planning uses 2 pounds per effective folder minute, but the
      value remains configurable and must later be calibrated from observed
      production data.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
    confidence: medium
  - id: commercial_orders_low_volume_v1
    statement:
      Commercial orders are low enough volume in v1 to stay inside the same
      simple batching model.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
    confidence: medium
  - id: manual_stage_confirmation_is_acceptable_v1
    statement: Manual operator confirmation is acceptable as the source of stage
      completion truth in v1.
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
    confidence: high
open_questions:
  - id: exact_scheduler_ordering_rules
    question:
      What stable tie-breakers should order candidates with equal priority,
      due-date bucket, and packing rank?
    status: deprecated
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: exception_effects
    question:
      How should manual holds, hard-confirmed cancellations, rewash, damaged
      items, and missing bags affect an accepted production_run?
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
      - memdelta-2026-07-10-fixed-pulse-scheduling
  - id: role_permission_mapping
    question: Which actions belong to owner, manager, employee, and admin roles?
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: production_shift_boundaries
    question: How should production shifts constrain schedule generation,
      continuation, and completion?
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
  - id: replan_after_drift
    question:
      When execution drifts from a schedule, should LPMS preserve the old
      plan, replan remaining batches, or create a new schedule_run?
    status: active
    sources:
      - memdelta-2026-07-08-laundry-production-core
