work_id: production-recovery-hardening
title: Failure-safe deployment rollback and production-shaped recovery
status: active

goal:
  - Make release rollback and migration-state recording conservative under partial failure.
  - Prove the database recovery procedure against the production schema, roles, grants, and release migrations.
  - Keep backup execution independent from observability availability and make the remaining disaster-recovery gates explicit.

invariants:
  - One shared host lock serializes automated deploy, manual deploy, and rollback mutation.
  - An unresolved runtime identity is never discarded until one exact recovery target is publicly verified.
  - Migration starts only after durable state records that the target may have affected the database or runtime.
  - Rollback uses one exact prior five-image manifest and never mixes release identities.
  - Production restore never imports into an existing application database or silently discards the damaged database.
  - Restore validation covers public and drizzle schemas, application roles, grants, release migrations, and runtime access before ingress resumes.
  - A durable restore journal blocks deploy, rollback, backup, and direct role mutation until the exact restore resumes or a confirmation-gated pre-cutover abort retires it.
  - Recovery binds the release, backup, four public health authorities, expected static IP, and provisioned host identity; restart policies remain fenced until durable public verification.
  - Backup success or failure is determined by the backup command, never by Sentry availability or telemetry exit status.
  - Non-root AWS management and recovery administration, current GoDaddy authoritative-DNS administration, and Pressly Production Owner credential custody are separate human authorities and must never be inferred from one another or from a file bundle.
  - A replacement-host drill uses the exact final pre-drill deployed release from freshly retrieved off-host escrow and the latest complete immutable backup triplet available at drill start.
  - Recovery proof uses ordinary TOTP authentication, isolated non-PII application writes and reads, measured RPO and RTO, and teardown bounded to uniquely identified drill resources.
  - Secrets, database contents, customer payloads, DSNs, private keys, and recovery passphrases never enter Stateworks evidence.
  - Existing launch and vendor-enablement gates remain stopped until this package and their own human obligations are satisfied.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

tasks:
  - id: T0
    title: Reconcile the production recovery baseline
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps: []
    reads:
      - repo:infra/aws/lightsail
      - repo:infra/aws/docs
      - repo:stateworks/work/active/lpms-production-readiness
      - external:production-health-and-backup-metadata
    writes:
      - repo:stateworks/work/active/production-recovery-hardening/evidence.md
    action:
      - Reproduce the reported rollback, migration classification, restore, and monitoring failure modes.
      - Record a read-only production baseline without exposing secrets or customer data.
    verifier:
      - Evidence separates repository defects, current production health, and unproved recovery obligations.
    rollback: No rollback is required for read-only characterization.
    secret_handling: never_show_agent
    status: committed
    evidence:
      - stateworks/work/active/production-recovery-hardening/evidence.md#t0---baseline

  - id: T1
    title: Make deploy and rollback state failure-safe
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps: [T0]
    reads:
      - repo:infra/aws/lightsail/deploy.sh
      - repo:infra/aws/lightsail/rollback.sh
      - repo:tooling/test/release-deployment.test.mjs
    writes:
      - repo:infra/aws/lightsail/deploy.sh
      - repo:infra/aws/lightsail/rollback.sh
      - repo:tooling/test/release-deployment.test.mjs
    action:
      - Serialize host release mutations with one shared lock.
      - Preserve unresolved runtime and exact recovery-target identities through every rollback failure stage.
      - Record running-unverified state durably before migration execution.
      - Validate canonical app-to-repository image mapping and unique digests locally.
    verifier:
      - Focused tests cover contention, migration failure, pull and label failure, partial Compose failure, public-health failure, rollback retry, wrong repositories, and aliased digests.
    rollback: Revert deploy, rollback, and their focused tests together before publication.
    secret_handling: none
    status: committed
    evidence:
      - stateworks/work/active/production-recovery-hardening/evidence.md#t1---failure-safe-deploy-and-rollback

  - id: T2
    title: Implement a production-shaped database restore
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps: [T0]
    reads:
      - repo:infra/aws/lightsail/backup-postgres.sh
      - repo:infra/aws/docs/restore-postgres.md
      - repo:packages/db/src/migrations
    writes:
      - repo:infra/aws/lightsail/restore-postgres.sh
      - repo:infra/aws/lightsail/restore-postgres-proof.sh
      - repo:infra/aws/docs/restore-postgres.md
      - repo:infra/aws/docs/restore-postgres-drill.md
      - repo:tooling/test/ci-production-artifacts.test.mjs
    action:
      - Restore into a clean candidate database instead of existing public and drizzle schemas.
      - Reapply roles, ownership, and grants; run the checked-out release migrations; validate application and backup privileges.
      - Promote only after validation while retaining the damaged database under a quarantine name.
      - Persist exact recovery and public-host authority, block every competing operational entrypoint, and keep ingress/writer restart policies fenced until exact public verification.
      - Exercise the same contract in an isolated disposable proof with no production volume access.
    verifier:
      - The disposable encrypted-backup proof passes and cleans every container, volume, image, and temporary artifact it owns.
      - Bash syntax, focused tests, and documentation checks pass.
    rollback:
      - Before promotion, remove only the candidate database and resume the untouched production database.
      - After promotion, keep ingress and writers stopped and follow the explicit quarantined-database recovery procedure.
    secret_handling: never_show_agent
    status: committed
    evidence:
      - stateworks/work/active/production-recovery-hardening/evidence.md#t2---production-shaped-database-restore

  - id: T3
    title: Decouple backup execution from Sentry
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps: [T0]
    reads:
      - repo:infra/aws/lightsail/run-monitored-operation.sh
      - repo:tooling/test/host-operations-monitoring.test.mjs
    writes:
      - repo:infra/aws/lightsail/run-monitored-operation.sh
      - repo:infra/aws/lightsail/README.md
      - repo:tooling/test/host-operations-monitoring.test.mjs
    action:
      - Run and classify the locked operation before attempting bounded best-effort telemetry.
      - Preserve the operation exit status across missing, malformed, failing, or stalled Sentry configuration.
      - Prevent DSNs from reaching diagnostics and define a private bounded fallback log.
    verifier:
      - Focused tests prove exact exit preservation and no DSN disclosure across successful, failing, missing, malformed, and noisy telemetry fixtures.
    rollback: Revert the runner, focused tests, and corresponding runbook text together before publication.
    secret_handling: never_show_agent
    status: committed
    evidence:
      - stateworks/work/active/production-recovery-hardening/evidence.md#t3---backup-remains-authoritative

  - id: V1
    title: Verify repository recovery behavior
    type: verification
    owner: agent
    surface: repo
    agent_can_verify: true
    deps: [T1, T2, T3]
    reads:
      - repo
    writes:
      - repo:stateworks/work/active/production-recovery-hardening/evidence.md
    action:
      - Run shell syntax, focused failure-path tests, the disposable restore proof, Stateworks validation, architecture checks, and the full repository gates.
      - Review the combined diff for rollback, recovery, secret-handling, and cleanup regressions.
    verifier:
      - All required checks pass with no owned disposable resources left behind.
    rollback: Repair the failed slice or revert the unverified work unit before publication.
    secret_handling: none
    status: committed
    evidence:
      - stateworks/work/active/production-recovery-hardening/evidence.md#v1---combined-repository-verification

  - id: H1
    title: Review and publish the repaired production release
    type: human_action
    owner: human
    surface: github
    agent_can_verify: false
    deps: [V1]
    reads:
      - repo:stateworks/work/active/production-recovery-hardening/evidence.md
      - external:GitHub-required-checks
    writes:
      - external:main-branch
      - external:production-release
      - repo:stateworks/work/active/production-recovery-hardening/human-actions.md
    human_instructions:
      - Review the recovery diff and disposable proof; merge only through protected main after strict CI and CodeQL pass.
      - Observe the exact main release and normal workflow-run deployment to terminal success.
      - From the independently verified production static IP and four approved HTTPS health URLs, install `/etc/pressly/host-identity.json` root-owned and mode `0644` exactly as the restore runbook specifies.
      - Do not execute a live restore merely to test the runbook.
      - Record only workflow IDs, source SHA, timestamps, and redacted outcomes.
    expected_external_state:
      - Production runs the reviewed five-image release, the repaired scripts exist at the deployed source SHA, and the immutable host-identity input is installed from independently verified infrastructure facts.
    verifier:
      - Main CI, CodeQL, immutable artifact publication, deployment, and public health succeed for one exact source SHA.
    rollback: Use the repaired exact-manifest rollback procedure if deployment does not verify publicly.
    secret_handling: never_show_agent
    status: latent
    evidence: []

  - id: V2
    title: Observe deployed recovery scripts and natural backup schedule
    type: verification
    owner: agent
    surface: aws
    agent_can_verify: true
    deps: [H1]
    reads:
      - external:production-host-script-hashes
      - external:root-owned-production-host-identity
      - external:production-cron-and-Sentry-monitor
      - external:private-versioned-backup-metadata
    writes:
      - repo:stateworks/work/active/production-recovery-hardening/evidence.md
    action:
      - Match deployed script hashes to the published source SHA.
      - Verify the root-owned host-identity file has the approved static IP and health authorities, then run the stable restore `--preflight-only` against an approved backup without restoring data.
      - Observe the first natural backup at the approved hourly schedule using the deployed runner and prove local checksum, remote size/version/encryption, and successful or safely skipped telemetry.
    verifier:
      - Restore admission, natural scheduling, backup durability, and monitoring independence are proven without exposing credential or payload values.
    rollback: Restore the prior verified cron recipe if the new deployed recipe cannot execute the backup command.
    secret_handling: never_show_agent
    status: latent
    evidence: []

  - id: H2
    title: Approve recovery objectives and independent custody
    type: human_action
    owner: human
    surface: other
    agent_can_verify: false
    deps: [V1]
    reads:
      - repo:infra/aws/lightsail/README.md
      - repo:stateworks/work/active/production-recovery-hardening/evidence.md
      - external:aws-management-account-identity-center-access
      - external:aws-recovery-account-identity-center-access
      - external:godaddy-authoritative-dns-administration
      - external:bitwarden-pressly-recovery-collection
      - external:pressly-production-owner-credential-material
    writes:
      - external:approved-RPO-and-RTO
      - external:immutable-secondary-backup
      - external:off-host-non-regenerable-recovery-material
      - external:recoverable-aws-management-account-access
      - external:recoverable-aws-recovery-account-access
      - external:current-godaddy-authoritative-dns-access
      - external:off-host-production-owner-credential-material
      - repo:stateworks/work/active/production-recovery-hardening/human-actions.md
    preconditions:
      - Repository recovery behavior is verified, and no secret value or customer payload will be recorded as evidence.
      - AWS management-account access, recovery-account administration, current GoDaddy authoritative-DNS access, and Pressly Production Owner credential custody are treated as distinct authorities.
    human_instructions:
      - Confirm the approved one-hour maximum data-loss objective, four-hour recovery-time objective, and 90-day S3 Object Lock COMPLIANCE retention.
      - Maintain an independently administered encrypted secondary copy whose production-host writer has no delete or retention-mutation authority; prove exact-version retention rather than inferring it from the bucket default.
      - Separately prove non-root IAM Identity Center `AdministratorAccess` to AWS management account `088594414587` and recovery account `067200612921`; do not use or recover a root credential for either proof.
      - Separately use the current GoDaddy authentication path to open the authoritative DNS administration page for `trypressly.com`; confirm nameserver and record edit controls without changing DNS.
      - Record Steven's explicit decision to defer a separate vault-backed GoDaddy MFA-recovery method as accepted nonblocking pre-launch debt; do not claim that backup method is proven.
      - 'Keep an approved encrypted off-host copy of the non-regenerable recovery material required for host loss: backup passphrase, exact runtime configuration, exact release identity, required host-access key, and Pressly Production Owner password plus ordinary TOTP.'
      - Record the separate Production Owner recovery-code path as accepted nonblocking pre-launch debt; ordinary TOTP remains mandatory for H3 and the backup path must not be claimed as present.
      - Do not require retrieval or escrow of the live secondary-writer key. Proven recovery-account administration can create or rotate a replacement least-privilege writer for a replacement host.
      - Validate the exact final pre-drill file bundle locally, upload it to the previously retrieval-proven off-host store, then delete and absence-check only the validated local archive and staging directory. H3 performs a fresh independent retrieval and integrity check before using it.
      - Record owners, retention, objective values, separate access-boundary results, and redacted outcomes only; never record secret values, customer data, TOTP material, or recovery codes.
    expected_external_state:
      - A compromised production instance cannot erase every usable backup or the non-regenerable material needed to recover it.
      - The recovery owner can independently enter AWS management account `088594414587` and recovery account `067200612921`, administer current GoDaddy authoritative DNS, and obtain the Production Owner password plus ordinary TOTP without relying on the failed host. Actual Owner authentication remains an H3 verifier.
      - Separate vault-backed GoDaddy MFA-recovery and Production Owner recovery-code methods remain explicitly accepted pre-launch debt and are not represented as present.
      - Recovery-account administration can mint a replacement narrow writer, so the live writer key is not an escrow dependency.
    verifier:
      - Human provides the approved one-hour RPO, four-hour RTO, and 90-day COMPLIANCE values plus exact-version Object Lock mode and retain-until readback.
      - Human provides separate dated, redacted proof of non-root AWS management- and recovery-account `AdministratorAccess` plus current GoDaddy authoritative-DNS administration, nameserver readback, and record-edit controls; none is inferred from another.
      - Evidence explicitly identifies the deferred GoDaddy MFA-recovery and Production Owner recovery-code backups as accepted nonblocking pre-launch debt rather than proven controls.
      - Human provides dated, redacted local inventory/checksum, off-host upload, and validated local-copy deletion results for the exact final pre-drill file bundle, plus separate redacted confirmation of Production Owner password and ordinary-TOTP availability without disclosing any value.
      - Evidence states that the live secondary-writer key is regenerable and is not required in escrow.
    rollback: Disable an unsafe replication rule without deleting the existing primary backup history.
    secret_handling: never_show_agent
    status: latent
    evidence: []

  - id: H3
    title: Run a complete replacement-instance recovery drill
    type: human_action
    owner: human
    surface: aws
    agent_can_verify: false
    deps: [V2, H2]
    reads:
      - external:immutable-secondary-backup
      - external:final-pre-drill-deployed-release
      - external:refreshed-off-host-recovery-material
      - external:pressly-production-owner-credential-material
      - repo:infra/aws/docs/restore-postgres.md
    writes:
      - external:disposable-replacement-instance
      - external:isolated-drill-routing
      - external:drill-only-application-record
      - repo:stateworks/work/active/production-recovery-hardening/human-actions.md
    preconditions:
      - V2 is committed and H2 independently proves immutable custody plus separate non-root AWS management and recovery administration, current GoDaddy authoritative-DNS administration, and Production Owner credential-material availability. Actual Owner authentication remains an H3 verifier.
      - The final pre-drill merge has deployed successfully, and no replacement instance is created until the approved off-host attachment is refreshed from that exact release and retrieved checksum verification succeeds.
      - The drill controller has a unique instance name and drill tags and can enumerate every resource it is authorized to remove before any creation begins.
    human_instructions:
      - After the final pre-drill merge deploys successfully, read back the exact deployed source and five digest-pinned images. Refresh the approved Bitwarden attachment from that exact host state, retrieve it again, and verify its checksum, inventory, and `current-release.json` match before creating the replacement host.
      - At the declared drill start, select the latest complete immutable secondary triplet whose dump, checksum, and metadata versions all exist with matching identities and COMPLIANCE retention; use exact version-pinned retrieval and record only redacted version and timestamp evidence.
      - Start the RTO clock at the declared host-loss drill start and calculate RPO from that same timestamp to the selected backup completion timestamp.
      - Build a uniquely named and tagged disposable replacement instance without mounting, mutating, or routing production resources.
      - Recover the exact refreshed release and configuration, restore the selected backup, and authenticate as the Production Owner with the ordinary TOTP. A recovery code must not substitute for ordinary TOTP because that would mask restored MFA or clock failure.
      - Through isolated DNS or hosts-file routing, prove one explicitly synthetic non-PII application write and authoritative readback plus every public health surface. Never copy a production customer payload into the drill.
      - Require measured RPO at or below one hour and measured RTO at or below four hours. A target value or healthy schedule is not a measured result.
      - After evidence is captured, validate exact names and drill tags before deleting only the disposable instance, isolated routing, synthetic drill data, and other resources created by this drill; read back their absence without deleting production, retained backups, snapshots, or unrelated stopped instances.
    expected_external_state:
      - Pressly has one measured end-to-end host-loss recovery proof bound to the exact final pre-drill release, refreshed off-host material, and latest complete immutable triplet available at drill start.
      - Ordinary-TOTP owner authentication, an isolated non-PII write/read, and all health surfaces succeed within the approved RPO and RTO.
      - No drill-owned resource remains and no production or unrelated resource was changed or deleted.
    verifier:
      - Human provides the post-merge deployed source SHA and five image digests plus a refreshed off-host bundle checksum/inventory whose release identity matches exactly.
      - Human provides the selected latest complete triplet's redacted immutable version identities and completion timestamp, measured RPO no greater than one hour, and measured RTO no greater than four hours.
      - Human provides redacted ordinary-TOTP Production Owner authentication, synthetic non-PII application write/read, and isolated health evidence.
      - Human provides exact tag-validated teardown inventory and absence readback proving only drill-owned resources were removed.
    rollback: On any failed precondition or verifier, stop the drill and remove only exact tag-validated drill resources and isolated routing; never alter production, retained backups, snapshots, or unrelated resources.
    secret_handling: never_show_agent
    status: pending
    evidence: []

  - id: V3
    title: Close recovery hardening
    type: verification
    owner: agent
    surface: other
    agent_can_verify: true
    deps: [V2, H3]
    reads:
      - repo:stateworks/work/active/production-recovery-hardening/evidence.md
      - repo:stateworks/work/active/production-recovery-hardening/human-actions.md
    writes:
      - repo:stateworks/work/active/production-recovery-hardening/state.yaml
      - repo:stateworks/work/active/production-recovery-hardening/final-report.md
    action:
      - Verify repository, deployed schedule, immutable custody, and replacement-instance evidence agree with the declared invariants.
    verifier:
      - No recovery obligation is inferred from a local-only or manually invoked proof.
      - Every human claim is redacted, dated, and independently checkable.
    rollback: Reopen the exact failed task instead of closing the package on incomplete evidence.
    secret_handling: never_show_agent
    status: pending
    evidence: []
