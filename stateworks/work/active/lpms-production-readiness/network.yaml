work_id: lpms-production-readiness
title: LPMS production readiness and controlled pilot
status: active

goal:
  - Replace synthetic and disabled LPMS runtime seams with authenticated, location-aware, observable production behavior.
  - Ship API, Web, Worker, and Processor as one immutable and reversible production release on the existing Lightsail Compose topology.
  - Prove one controlled happy-path pilot from signed Cents demand through operator-confirmed production without implementing deferred exception workflows.

invariants:
  - No module imports, calls, or declares a package dependency on another module; apps remain the only composition roots.
  - Policy and computation modules remain headless and expose no HTTP routes.
  - Production writes remain strongly consistent, versioned, idempotent, and atomically recorded with work events.
  - Cents authenticity is verified against exact raw body bytes before JSON parsing or durable receipt.
  - The shared Cents secret is used as an HMAC key and is never transmitted as a raw header value, logged, committed, or placed in Stateworks.
  - Production accepts only the versioned HMAC-SHA256 contract with a bounded timestamp window and constant-time comparison; a static-secret fallback is not enabled.
  - Invalid, missing, malformed, stale, future, or body-mismatched signatures create no receipt or projection.
  - Customer PII, bearer credentials, signatures, secrets, recovery codes, and production connection strings never appear in repository fixtures, evidence, logs, screenshots, or durable memory.
  - Durable Cents order receipts retain only canonical LPMS input plus a raw-body digest unless encrypted short-retention storage is separately approved.
  - Customer and marketing events are authenticated and minimally acknowledged without persisting irrelevant PII.
  - Cents source ordering uses the vendor updatedAt fact, not webhook arrival order or an invented numeric source version.
  - Every Cents storeId maps explicitly to one Pressly location; unknown stores fail closed and no scheduling query crosses locations.
  - Missing bag count is never fabricated; an order remains unschedulable until a versioned intake command records the fact or an authoritative vendor field is proven.
  - Runtime processor code contains no demo mode, frozen date, hardcoded location, or production fixture; deterministic synthetic data lives under test only.
  - Processor authentication reuses the opaque server-side session authority and does not introduce JWTs.
  - Processor session credentials are not persisted in browser localStorage; same-origin cookie transport is Secure, HttpOnly, SameSite=Strict, and protected against CSRF on unsafe requests.
  - The worker runs as a private long-lived container with no public route and cannot bypass production policy or transaction boundaries.
  - Caddy is the only public production ingress; Postgres, Worker, API container ports, and internal service traffic remain private.
  - Main-branch CI is the only normal source of production artifacts and every release records immutable digests for API, Web, Worker, and Processor.
  - No production merge, deploy, vendor enablement, secret placement, DNS change, or pilot begins without its explicit human task.
  - Existing user changes and unrelated worktree files are preserved.
  - Manual hold, cancellation, rework, damage, missing-bag, breakdown, late-work, and reassignment workflows remain deferred; encountering one during the pilot stops LPMS use for that work.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

tasks:
  - id: T0
    title: Reconcile the production-readiness baseline
