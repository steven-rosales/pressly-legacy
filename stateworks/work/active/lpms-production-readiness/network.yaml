      - Tests use a designated non-customer or safely controlled order and do not disrupt live production.
      - Negative signature tests are rate-limited and approved for the production endpoint; otherwise they run against a production-like isolated endpoint.
    action:
      - Record the human-run Postman valid-signature proof and safe wrong-key, modified-body, stale-timestamp, and duplicate proofs.
      - Trace one signed order event from durable receipt through Worker projection and the mapped production location.
      - Prove an order without bag count remains intake-pending, then record intake through the Processor and prove it becomes eligible.
      - Prove ignored customer or marketing delivery retains no customer payload and only minimal receipt metadata.
      - Prove Worker heartbeat, retry/dead-letter visibility, bounded replay, and restart recovery without duplicating projection.
      - If the Cents read API was confirmed, prove reconciliation from a stored watermark; otherwise prove and document manual replay as the launch fallback.
    postconditions:
      - Live signed ingress, projection, location mapping, intake, and recovery behavior have redacted evidence.
      - No unresolved authenticity, PII, worker, or mapping defect remains before pilot approval.
    verifier:
      - Human evidence covers every applicable proof with timestamps, safe identifiers, and outcomes.
      - Receipt and projection counts prove duplicate effectiveness without exposing raw payloads.
      - Unsupported automatic reconciliation is explicitly accepted as manual operational debt or blocks the pilot.
    rollback:
      - Disable Cents delivery, stop Worker if necessary, retain authenticated receipts, and rotate the key after any suspected exposure.
    secret_handling: never_show_agent
    status: pending
    evidence: []

  - id: H6
    title: Approve a controlled happy-path pilot
    type: human_gate
    owner: human
    surface: other
    agent_can_verify: false
    deps:
      - V4
    reads:
      - repo:stateworks/work/active/lpms-production-readiness/evidence.md
      - repo:stateworks/work/active/lpms-production-readiness/brief.md
      - external:operator-staffing-and-facility-state
    writes:
      - repo:stateworks/work/active/lpms-production-readiness/human-actions.md
    human_instructions:
      - Review signed-ingress, rollback, backup, worker, processor, facility, alert, and operator evidence.
      - Choose one low-risk shift window and a bounded set of ordinary wash-and-fold orders that require no known exception handling.
      - Confirm trained operator coverage and the existing manual process is available immediately as fallback.
      - Define stop conditions for auth failure, stale or missing order, bad capacity, location mismatch, worker lag, dead letter, invariant rejection, UI uncertainty, or any deferred exception.
      - Record explicit approval, date, location, order-count bound, observers, and stop conditions without customer identifiers.
    expected_external_state:
      - A bounded pilot window is approved with staffing, fallback, and stop authority.
    verifier:
      - Human approval is explicit and all V4 critical findings are resolved or consciously block approval.
    rollback:
      - Withdraw approval and continue the existing manual workflow.
    secret_handling: never_show_agent
    status: pending
    evidence: []

  - id: H7
    title: Operate and observe the controlled pilot
    type: human_action
    owner: human
    surface: other
    agent_can_verify: false
    deps:
      - H6
    reads:
      - external:approved-pilot-orders-and-floor-state
      - external:Processor
      - external:worker-and-API-observability
    writes:
      - external:production-work-events-and-stage-state
      - repo:stateworks/work/active/lpms-production-readiness/human-actions.md
    human_instructions:
      - Verify each pilot order is projected to the correct location, intake-complete, and eligible before scheduling.
      - Review pulse capacity, whole-order batches, machines, makespan, warnings, and completion forecast before accepting the schedule.
      - Operate only the existing sorting, washing, drying, and folding/packaging happy path, confirming each command and version through the Processor.
      - Observe Worker heartbeat, pending age, retries, dead letters, API errors, command conflicts, and invariant rejections throughout the window.
      - Stop LPMS immediately and return affected work to the manual process when any H6 stop condition or deferred exception appears; do not invent an override.
      - Record redacted totals, timings, batch weights, forecast versus actual, alerts, conflicts, operator feedback, and any stopped work without customer PII.
    expected_external_state:
      - The bounded pilot either completes through four stages with auditable work events or stops safely with no fabricated state.
    verifier:
      - Human supplies redacted operational evidence for every pilot batch and confirms database, board, and physical floor state agree.
      - Any stop is treated as valid evidence and routes to repair or exception-work planning rather than being hidden.
    rollback:
      - Stop new LPMS commands, disable Cents delivery if ingress is unsafe, and use the existing manual operating process; preserve all audit evidence.
    secret_handling: never_show_agent
    status: pending
    evidence: []

  - id: V5
    title: Close production readiness and update durable memory
    type: verification
    owner: agent
    surface: memory
    agent_can_verify: true
    deps:
      - H7
    reads:
      - repo:stateworks/work/active/lpms-production-readiness/evidence.md
      - repo:stateworks/work/active/lpms-production-readiness/human-actions.md
      - repo:docs/plan/lpms.md
      - repo:docs/architecture.md
      - repo:docs/devops.md
      - memory:domain:laundry-production/current
    writes:
      - repo:stateworks/work/active/lpms-production-readiness/evidence.md
      - repo:stateworks/work/active/lpms-production-readiness/final-report.md
      - repo:stateworks/work/active/lpms-production-readiness/state.yaml
      - repo:stateworks/memory/domains/laundry-production/deltas/lpms-production-readiness.memory-delta.yaml
      - repo:stateworks/memory/domains/laundry-production/memory.yaml
      - repo:stateworks/memory/domains/laundry-production/context-pack.md
      - repo:docs/plan/lpms.md
      - repo:docs/architecture.md
      - repo:docs/devops.md
      - repo:apps/processor/README.md
      - repo:apps/worker/README.md
    preconditions:
      - Pilot and external evidence are redacted and contain no secret, signature, credential, recovery code, or customer PII.
      - Every committed task has passing verification or explicit human proof.
    action:
      - Reconcile docs to actual deployed behavior, operating procedures, known limits, and pilot measurements.
      - Record whether automatic Cents reconciliation is supported or whether manual replay remains accepted operational debt.
      - Record pilot outcome, rollback readiness, residual risks, and the still-deferred exception-work boundary.
      - Propose and apply a source-backed laundry-production memory delta only for facts proven by implementation and pilot evidence.
      - Run full repository, memory, Stateworks, release-manifest, and production-topology verification.
      - Mark tasks committed only after evidence exists; then close and move the work item from active to done through the normal lifecycle procedure.
      - Create a separate queued exception-work item only if the human explicitly authorizes its scope after pilot learning.
    postconditions:
      - Final report says complete, blocked, or repaired with exact evidence and residual risk.
      - Durable memory reflects verified production behavior and excludes secrets and unverified vendor claims.
      - Production-readiness work can move to done without reopening the happy-path work item.
    verifier:
      - pnpm format:check
      - pnpm lint
      - pnpm typecheck
      - pnpm test
      - pnpm build
      - pnpm stateworks:memory:validate stateworks/memory/domains/laundry-production/memory.yaml
      - pnpm stateworks:memory:context laundry-production
      - pnpm stateworks:validate stateworks/work/active/lpms-production-readiness/network.yaml
      - pnpm stateworks:verify stateworks/work/active/lpms-production-readiness/network.yaml --state stateworks/work/active/lpms-production-readiness/state.yaml
      - git diff --check
    rollback:
      - Revert unverified docs or memory updates, keep the work active, and preserve evidence for repair.
    secret_handling: none
    status: pending
    evidence: []
