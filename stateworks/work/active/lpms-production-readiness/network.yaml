      - repo:packages/db/src/migrations
      - repo:modules/business/production/src/project-cents-order
      - repo:modules/business/production/src/create-schedule
      - repo:modules/business/production/src/persistence
      - repo:modules/policy/production
      - repo:docs/plan/lpms.md
    writes:
      - repo:packages/db/src/schema/laundry-production.schema.ts
      - repo:packages/db/src/migrations
      - repo:packages/db/src/migrations/meta
      - repo:packages/db/test
      - repo:modules/business/production/src/project-cents-order
      - repo:modules/business/production/src/create-schedule
      - repo:modules/business/production/src/persistence
      - repo:modules/business/production/test
    preconditions:
      - Migration tests use an isolated clean database and a representative pre-migration fixture.
      - Existing migration history is never rewritten after deployment.
    action:
      - Replace invented numeric vendor ordering with source_updated_at ordering plus equal-timestamp divergence detection.
      - Add an explicit Cents store-to-Pressly-location mapping owned by production persistence and configured through a composition-root capability.
      - Scope CRM projections, production orders, eligible-order reads, shifts, configs, schedules, runs, boards, and uniqueness constraints by location where required.
      - Keep unknown-store events pending or dead with a stable inspectable code; never project them into a default location.
      - Model bag count as missing until authoritative vendor input or operator intake records it, with provenance and optimistic versioning.
      - Make scheduling eligibility require current IN_PROGRESS status, location mapping, positive derived weight, and completed bag intake.
      - Add forward migration, rollback guidance, indexes, constraints, and concurrent/out-of-order projection tests.
    postconditions:
      - One location can never schedule another location's order.
      - Newer source updatedAt wins regardless of arrival order; equal-time divergence is visible.
      - Missing bag count is represented honestly and blocks scheduling without blocking CRM projection.
    verifier:
      - pnpm --filter @pressly/db test
      - pnpm --filter @pressly/db test:integration
      - pnpm --filter @pressly/production test
      - pnpm --filter @pressly/production typecheck
      - pnpm db:test:migrate
      - Migration upgrade test proves pre-existing rows are handled explicitly.
      - Cross-location and concurrent projection integration tests pass.
    rollback:
      - Before shared deployment, revert the migration and code together; after deployment, disable scheduling and add a forward corrective migration.
    secret_handling: none
    status: pending
    evidence: []

