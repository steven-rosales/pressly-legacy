  - id: T6
    title: Productionize worker observability and recovery
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps:
      - T2
      - T3
      - T4
    reads:
      - repo:apps/worker
      - repo:packages/logging
      - repo:packages/metrics
      - repo:packages/db
      - repo:modules/business/production
      - repo:docs/plan/lpms.md
    writes:
      - repo:apps/worker/src
      - repo:apps/worker/test
      - repo:apps/worker/.env.example
      - repo:apps/worker/README.md
      - repo:apps/api/src/commands
      - repo:packages/logging
      - repo:packages/metrics
    preconditions:
      - Durable receipt and projection semantics from T2 and T3 are stable.
      - Reconciliation support is not claimed until an authoritative Cents read API is proven.
    action:
      - Replace null runtime logger, counter, and measurement sinks with injected production adapters and safe structured context.
      - Fail startup when the production worker is expected but disabled or critically misconfigured.
      - Emit startup, shutdown, fatal, lease-recovery, retry, dead-letter, oldest-pending-age, processing-latency, and reconciliation-watermark signals without per-poll noise.
      - Add a health or heartbeat proof that detects a running-but-stalled loop without exposing a public worker endpoint.
      - Schedule reconciliation only when the verified Cents read adapter is configured; otherwise report unsupported state and retain an explicit manual replay path.
      - Add authenticated operator commands for dead-letter inspection and bounded replay through the same projection use case, never direct row mutation.
      - Reuse the existing server incident destination with runtime=worker rather than introducing a new monitoring platform.
      - Prove graceful shutdown, database outage recovery, crash after claim, crash after commit, poison event isolation, replay idempotency, and bounded backoff.
    postconditions:
      - Operators can distinguish idle, healthy, delayed, retrying, dead-lettered, unsupported reconciliation, and crashed worker states.
      - Worker restart and replay cannot duplicate projections or bypass production invariants.
      - The worker has no route and no public port.
    verifier:
      - pnpm --filter @pressly/worker test
      - pnpm --filter @pressly/worker test:integration
      - pnpm --filter @pressly/worker typecheck
      - pnpm --filter @pressly/worker lint
      - pnpm --filter @pressly/api test
      - Logging-redaction and stalled-heartbeat tests pass.
    rollback:
      - Stop the worker, leave pending and dead rows intact, and use the bounded replay command after repair.
    secret_handling: env_file_only
    status: pending
    evidence: []

