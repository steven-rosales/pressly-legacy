      - repo:stateworks/memory/domains/laundry-production/context-pack.md
      - repo:docs/plan/lpms.md
      - repo:docs/architecture.md
      - repo:docs/devops.md
      - repo:apps/api
      - repo:apps/worker
      - repo:apps/processor
      - repo:modules/business/production
      - repo:modules/policy/production
      - repo:modules/computation/scheduling
      - repo:packages/contracts/src/cents
      - repo:packages/db/src/schema/laundry-production.schema.ts
      - repo:.github/workflows
      - repo:infra/aws/lightsail
      - external:https://chathelp.trycents.com/en/articles/12083443-cents-webhooks
    writes:
      - repo:docs/plan/lpms.md
      - repo:docs/architecture.md
      - repo:docs/devops.md
      - repo:stateworks/work/active/lpms-production-readiness/evidence.md
    preconditions:
      - The current dirty worktree is inventoried before editing.
      - The completed happy-path evidence is treated as the baseline rather than reimplemented.
    action:
      - Re-check every verified starting-point claim in the brief against the current checkout.
      - Record a gap matrix for vendor contract, ingress security, persistence, operator commands, processor startup, worker operations, release artifacts, production topology, and external setup.
      - Reconcile the canonical LPMS and architecture docs with the accepted HMAC, PII minimization, location isolation, bag-intake, same-origin processor, and four-image deployment decisions.
      - Name any checkout drift and replan only the affected downstream tasks before implementation.
      - Preserve the deferred exception boundary and do not use production credentials or customer data during the audit.
    postconditions:
      - The execution baseline is current, source-backed, and recorded without secrets.
      - Canonical docs no longer claim synthetic Cents fields or raw PII retention as verified production behavior.
      - Every downstream task still names real paths, boundaries, and proof obligations.
    verifier:
      - pnpm stateworks:validate stateworks/work/active/lpms-production-readiness/network.yaml
      - pnpm stateworks:memory:validate stateworks/memory/domains/laundry-production/memory.yaml
      - rg -n "HMAC|updatedAt|storeId|bag count|processor|worker" docs/plan/lpms.md docs/architecture.md docs/devops.md
      - git diff --check
    rollback:
      - Revert only unverified T0 documentation edits and retain the recorded baseline for repair.
    secret_handling: none
    status: pending
    evidence: []

  - id: T1
    title: Define the real Cents wire and canonical ingress contracts
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps:
      - T0
    reads:
      - repo:packages/contracts/src/cents
      - repo:packages/contracts/test
      - repo:apps/api/src/common/security/cents-webhook.ts
      - repo:modules/business/production/src/receive-cents-event
      - repo:modules/business/production/src/project-cents-order
      - repo:docs/plan/lpms.md
      - external:https://chathelp.trycents.com/en/articles/12083443-cents-webhooks
    writes:
      - repo:packages/contracts/src/cents
      - repo:packages/contracts/test
      - repo:apps/api/src/vendors/cents
      - repo:apps/api/test/cents
    preconditions:
      - T0 confirms the current documented and implemented contract mismatch.
      - Fixtures are synthetic or irreversibly redacted and contain no real customer identifiers.
    action:
      - Model the documented Cents wire payload separately from the canonical production receipt command.
      - Normalize action versus event, CANCELLED status, dueDate, updatedAt, unitPrice versus unitCost, and decimal dollar prices converted exactly to integer cents.
      - Classify all documented order, customer, and marketing event kinds without forcing non-order events through an order schema.
      - Map vendor order ID, storeId, and source updatedAt explicitly; do not require invented eventId, sourceVersion, occurredAt, or bagCount fields.
      - Derive deterministic redelivery identity from event kind, vendor entity ID, source updatedAt when present, and raw-body digest.
      - Return a minimized canonical order input or an explicit authenticated-ignore decision for non-production events.
      - Add payload limits and positive, malformed, variant, cancellation, decimal-money, unknown-event, and forward-compatible tests.
    postconditions:
      - Vendor wire changes are isolated in one API adapter and contract boundary.
      - Production application input contains canonical values and no transport aliases.
      - Missing bag count and unknown store remain explicit facts rather than defaults.
    verifier:
      - pnpm --filter @pressly/contracts test
      - pnpm --filter @pressly/contracts typecheck
      - pnpm --filter @pressly/contracts lint
      - pnpm --filter @pressly/api test -- cents
      - pnpm --filter @pressly/api typecheck
    rollback:
      - Revert the new wire adapter and contract tests while leaving the existing live verifier disabled.
    secret_handling: none
    status: pending
    evidence: []

  - id: T2
    title: Implement HMAC verification and minimized durable receipt
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps:
      - T1
    reads:
      - repo:apps/api/src/app.ts
      - repo:apps/api/src/common/config/env.ts
      - repo:apps/api/src/common/security/cents-webhook.ts
      - repo:apps/api/src/vendors/cents
      - repo:modules/business/production/src/receive-cents-event
      - repo:packages/db/src/schema/laundry-production.schema.ts
      - repo:packages/config
      - repo:packages/logging
      - repo:packages/metrics
    writes:
      - repo:apps/api/src/vendors/cents
      - repo:apps/api/src/common/config/env.ts
      - repo:apps/api/src/app.ts
      - repo:apps/api/.env.example
      - repo:apps/api/test/cents
      - repo:modules/business/production/src/receive-cents-event
      - repo:modules/business/production/test/receive-cents-event
      - repo:packages/db/src/schema/laundry-production.schema.ts
      - repo:packages/db/src/migrations
      - repo:packages/db/test
    preconditions:
      - Exact raw request bytes are available before the JSON parser for /webhooks/cents.
      - Production enablement can fail startup when required secret configuration is missing.
    action:
      - Verify X-Cents-Timestamp as Unix seconds and X-Cents-Signature as v1 hex HMAC-SHA256 over timestamp, a period, and exact raw body bytes.
      - Enforce a five-minute past and future window through an injected clock and compare fixed-length byte buffers in constant time.
      - Support current and previous HMAC keys during bounded rotation without revealing which key matched.
      - Distinguish invalid authentication from unavailable server configuration and malformed authenticated JSON.
      - Authenticate and normalize before durable write; persist canonical LPMS input, event classification, source metadata, and raw-body SHA-256 digest rather than irrelevant raw PII.
      - Store a minimal deduplicated receipt for authenticated ignored events so repeated delivery is auditable without retaining customer payloads.
      - Acknowledge only after the appropriate receipt commits; emit sparse redacted counters and security signals.
      - Add valid, wrong-key, missing-header, malformed-signature, stale, future, body-mutation, dual-key rotation, duplicate, ignored-event, database-failure, and logging-redaction tests.
    postconditions:
      - Invalid requests produce no receipt and no projection.
      - A valid order event is durably pending before success is returned.
      - An authenticated customer or marketing event is minimally recorded and ignored without PII retention.
      - Secret absence cannot silently disable verification in production.
    verifier:
      - pnpm --filter @pressly/api test
      - pnpm --filter @pressly/production test
      - pnpm --filter @pressly/db test
      - pnpm --filter @pressly/db test:integration
      - pnpm typecheck
      - pnpm exec vitest run tooling/test/architecture-boundaries.test.mjs
    rollback:
      - Disable the Cents route and retain already authenticated minimized receipts; do not enable an unsigned fallback.
    secret_handling: env_file_only
    status: pending
    evidence: []

  - id: T3
    title: Make Cents projection and production data location-aware
    type: primitive
    owner: agent
    surface: database
    agent_can_verify: true
    deps:
      - T2
    reads:
