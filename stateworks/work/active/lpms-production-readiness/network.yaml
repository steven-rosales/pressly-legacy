    preconditions:
      - Location discovery, workspace resume, intake, scheduling, board, and machine-assignment contracts are stable.
      - The existing opaque session remains the source of truth.
    action:
      - Remove demo mode, query-string live switching, demo adapters, frozen dates, hardcoded location, and runtime fixture imports from src.
      - Move only deterministic synthetic data still useful for tests into test fixtures.
      - Implement login, MFA challenge, session restore, expiry, logout, unauthorized recovery, and role-safe navigation using existing auth contracts.
      - Add same-origin Secure HttpOnly SameSite=Strict cookie transport for processor sessions while retaining existing bearer support for other clients.
      - Add CSRF tokens and origin checks for unsafe cookie-authenticated requests; never expose the opaque production token to browser storage.
      - Discover operator-authorized locations, remember only a non-secret location preference, and load the resumable production workspace on startup.
      - Derive shift defaults from current time, location timezone, persisted config, and operator input rather than hardcoded dates.
      - Add intake and machine-assignment controls needed for the happy path and preserve server-authoritative action availability.
      - Cover loading, empty, expired, forbidden, conflict, offline, retry, refresh, and no-active-run states in the existing design system and light/dark themes.
    postconditions:
      - Opening the production processor cannot show demo production data.
      - Reloading the browser restores authenticated server state or returns to login safely.
      - A credential is not readable from localStorage, sessionStorage, URL, logs, or rendered markup.
      - The UI does not duplicate production policy or scheduler decisions.
