work_id: pressly-control-workforce-identity
title: Pressly Control and workforce identity
status: active

goal:
  - Give owners, managers, and operators individual secure Pressly identities and scoped access.
  - Deliver Pressly Control for team, customer, and canonical order management at control.trypressly.com.
  - Keep Processor focused on physical execution while exposing truthful server-derived capabilities and an authorization-aware app switcher.

invariants:
  - Auth identity, workforce membership, scoped access grant, customer User, commercial Order, and Production execution remain distinct authoritative concepts.
  - Persistent invitation and membership lifecycles are governed by explicit kernel state-machine graphs.
  - Every privileged mutation is deny-by-default, actor-audited, versioned, idempotent, and scoped to the exact business and location authority.
  - Raw passwords, session credentials, MFA secrets, recovery codes, invitation tokens, customer payloads, and private data never enter Stateworks, logs, URLs sent to servers before deliberate acceptance, or audit metadata.
  - Invitation tokens are random, single-use, hashed at rest, time-bounded, rate-limited at acceptance, and invalid after acceptance, revocation, or expiry.
  - Suspending or ending workforce access removes effective grants and revokes relevant sessions immediately.
  - The final active owner cannot be suspended, ended, or stripped of ownership.
  - Managers cannot grant authority beyond their own active business and location scope, cannot create owners, and cannot escalate themselves.
  - Control creates canonical Customers and Orders only through their owning systems and never writes Production state directly.
  - A repaired production Order-detail contradiction is not closed from health or inactivity alone; one authenticated non-empty read, a fixed Sentry ingestion wait, and no recurrence are required before issue resolution and final verification.
  - Processor and Control use app-specific Secure, HttpOnly, SameSite cookies and server-owned CSRF policy; browser JavaScript receives no session credential.
  - Browser navigation and controls are driven by server-computed capabilities for the selected business and location; role-string arithmetic is not product authority.
  - Control and Processor share the same shadcn and Tailwind design language without importing business behavior across application boundaries.
  - Current opaque server-validated sessions remain authoritative; distributed JWT authentication stays queued until its adoption gate is real.
  - Existing unrelated worktree changes are preserved and excluded.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

