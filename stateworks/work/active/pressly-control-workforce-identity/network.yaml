    action:
      - Add table-driven API authorization proofs for owner, manager, operator, insufficient-MFA, suspended, ended, wrong-business, and wrong-location identities so server enforcement remains authoritative when UI controls are absent.
      - Exhaust every finite lifecycle state-and-event pair at the owning pure policy, prove replay and idempotency at the use-case boundary, and prove mutation races and isolation against real PostgreSQL where concurrency is part of the contract.
      - Verify representative API producer envelopes and Control and Processor consumer parsing against the same shared Zod contracts without introducing duplicate schemas or a generic contract platform.
      - Include the existing Users, Orders, and API integration suites in the repository's all-integration entry point so Control persistence and query paths cannot silently fall outside CI.
    verifier:
      - Pure lifecycle tests enumerate every allowed and denied state-event pair, including terminal states, without IO or a property-testing dependency for finite graphs.
      - Authorization tests prove both allow and deny outcomes at the API boundary for every supported workforce posture and exact business or location scope.
      - Idempotency tests prove same-key replay and conflicting replay behavior; concurrency tests use the dedicated test database and leave authoritative rows and audit evidence consistent.
      - Producer responses and browser consumers accept the same shared contracts and fail closed on incompatible shapes.
      - The all-integration command runs database, Auth, Users, Orders, Pricing, webhook-ingestion, Production, and API integration suites against a database whose name is explicitly test-only.
    rollback:
      - Revert only the added tests and integration-runner coverage; do not weaken product guards, lifecycle graphs, database constraints, or shared contracts to make a verifier pass.
    secret_handling: none
    status: pending
    evidence: []

