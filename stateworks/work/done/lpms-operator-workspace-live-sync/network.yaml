work_id: lpms-operator-workspace-live-sync
title: LPMS operator workspace and live synchronization checkpoint
status: complete

goal:
  - Record the implemented operator-workspace, shift-lifecycle, early-completion, and live-synchronization behavior as a source-backed checkpoint.
  - Verify the checkpoint with existing tests and read-only local runtime evidence before proposing memory acceptance.
  - Preserve intentional Worker inbox polling and the production-readiness H1 gate.

invariants:
  - Backend and database state own shift, schedule, run, queue, stage-action, and history identity.
  - Compute and Accept cannot mutate an expired shift; Start is legal only during the shift window.
  - A material pre-start shift or folder-count change is versioned, audited, and supersedes the current plan.
  - No production shift configuration changes after its production run exists.
  - A schedule used as production-run provenance is history even if its stored status remains draft or accepted.
  - Run-owned, closed, and expired shifts are read-only in the Processor.
  - Every planned stage retains one full pulse and no downstream stage starts before its planned boundary.
  - Early completion requires an exact, current, auditable confirmation; stale confirmation cannot commit.
  - Completing the final batch closes the production run and shift atomically with terminal floor facts.
  - SSE transports invalidation only; ordinary workspace and board reads remain authoritative.
  - Every production work event advances one durable per-location live revision in the same transaction.
  - The private Worker continues bounded durable-inbox polling independently of Processor synchronization.
  - This work changes only the invalid-route fallback needed to honor the agreed resource-route contract; local runtime and production records remain read-only.
  - Existing user changes, completed-work evidence, and deployed migration history are preserved.
  - No secret, signature, raw customer payload, credential, or production connection string enters Stateworks evidence.
  - The active production-readiness work remains at H1 until its existing human evidence is supplied.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

