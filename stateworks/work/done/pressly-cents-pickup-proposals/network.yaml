      - repo:apps/worker/test/jobs/process-webhook-inbox/cents
      - repo:apps/worker/src/bootstrap/worker-jobs.composition.ts
      - repo:modules/business/orders/src
      - repo:modules/business/users/src
    action:
      - Retain Cents authentication, inbox claim, normalization, and event completion behavior.
      - Submit a proposal command only for exact PICKED_UP order observations.
      - Ignore all other lifecycle values without resolving or creating canonical customers or orders.
      - Stop processing later source events into proposal or canonical updates.
      - Remove unreachable source-customer and source-authority orchestration specific to Cents canonical creation.
    verifier:
      - Worker tests enumerate every known Cents status and prove only PICKED_UP invokes the proposal port.
      - Retry and duplicate PICKED_UP events create one proposal.
      - Existing exact canonical identity and decided proposal cases are acknowledged no-ops.
      - No Worker import grants it ownership of proposal or canonical transition rules.
    rollback:
      - Disable proposal emission while retaining inbox events; do not restore source-driven canonical lifecycle.
    secret_handling: none
    status: pending
    evidence: []

