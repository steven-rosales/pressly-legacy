      - repo:packages/db/src/schema/webhook-ingestion.schema.ts
      - repo:modules/business/orders/src/persistence
    writes:
      - repo:packages/db/src/schema/orders.schema.ts
      - repo:packages/db/src/migrations
      - repo:packages/db/test
      - repo:modules/business/orders/src/persistence
      - repo:modules/business/orders/test
    action:
      - Add an exact source Order record that can exist without a canonical Order.
      - Add immutable proposal snapshot, lifecycle, optimistic version, decision actor, reason, and timestamps.
      - Enforce one proposal per source and external Order identity and terminal decision integrity.
      - Make acceptance serialize exact-identity lookup, proposal version, canonical creation, fulfillment release, command evidence, and outbox effects in one transaction.
      - Preserve existing canonical source links and create no historical proposal backfill.
    verifier:
      - Migration is additive and deterministic for existing canonical records.
      - Postgres tests cover concurrent pickup retries, concurrent accept, accept versus first-party creation, reject, replay, and terminal immutability.
      - Constraints prevent duplicate proposals and duplicate canonical source links.
    rollback:
      - Disable new reads while retaining additive proposal evidence; do not delete canonical or historical rows.
    secret_handling: none
    status: pending
    evidence: []

  - id: T3
    title: Cut Cents over to pickup-only proposal ingestion
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps:
