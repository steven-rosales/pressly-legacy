work_id: pressly-cents-pickup-proposals
title: Pressly Cents pickup proposals
status: active

goal:
  - Make Cents a pickup-only proposal adapter that cannot create or update canonical Pressly work without an operator decision.
  - Give operators exactly Accept and Reject commands over immutable incoming proposals.
  - Remove obsolete source-driven canonical mutation and lifecycle-reconciliation code while preserving durable ingress and audit guarantees.

invariants:
  - Only an exact Cents PICKED_UP observation may create one incoming-order proposal.
  - Every other Cents lifecycle observation is acknowledged and ignored by Users, Orders, fulfillment, proposals, and Production.
  - Incoming proposals use the explicit pending to accepted or rejected graph, with no local transition table.
  - A decided proposal is terminal; later source observations cannot update or reopen it.
  - Exact source and external Order identity is the only automatic duplicate-suppression key.
  - Contact values and fuzzy similarity never suppress, merge, or select canonical Users or Orders.
  - An existing canonical Order linked to the exact source identity suppresses proposal creation.
  - Accept rechecks exact identity and expected proposal version transactionally before creating one canonical Order and released fulfillment and creating or reusing one exact source-linked User when customer identity is present.
  - Reject creates no canonical User, Order, fulfillment, or Production work.
  - Future Pressly-owned products invoke canonical commands directly rather than privileged adapters.
  - Existing canonical Cents-origin records and historical evidence are preserved without proposal backfill.
  - Signed durable ingress, idempotency, canonical command receipts, aggregate graphs, transactional outbox, and peer-domain boundaries remain intact.
  - No production deployment, production-data cleanup, secret, credential, customer payload, or private token enters this work.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

