      - repo:stateworks/work/queued/lpms-order-control-correctness-hardening
      - repo:modules/business/orders
      - repo:modules/business/users
      - repo:apps/worker/src/jobs/process-webhook-inbox/cents
      - repo:apps/api/src/http/order-management
      - repo:apps/processor/src/features/order-control
      - repo:packages/contracts
      - repo:packages/db/src/schema
    writes:
      - repo:stateworks/work/done/pressly-cents-pickup-proposals/evidence.md
    action:
      - Record every current Cents path that creates or updates canonical Users, Orders, fulfillment, proposals, or Production.
      - Record the exact source identity, revision, inbox, command, graph, outbox, and UI boundaries that must remain.
      - Identify file overlap with active and queued Stateworks work before implementation.
      - Record deterministic pre-change tests or source proofs for non-pickup creation, post-pickup effects, and missing proposal decisions.
    verifier:
      - Evidence distinguishes retained infrastructure, replaced policy, deleted code, and unrelated dirty worktree changes.
      - No product or runtime state is changed by this characterization task.
    rollback:
      - No rollback is needed for read-only characterization.
    secret_handling: none
    status: pending
    evidence: []

  - id: T1
    title: Define the minimal incoming-proposal domain
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps:
      - T0
    reads:
      - repo:packages/kernel/src/state-machine.ts
      - repo:modules/business/orders/src
      - repo:packages/contracts/src/orders
    writes:
      - repo:modules/business/orders/src
      - repo:modules/business/orders/test
      - repo:packages/contracts/src/orders
      - repo:packages/contracts/test
    action:
      - Define the typed immutable incoming-order snapshot and pending, accepted, and rejected states.
      - Define Accept and Reject events in one authoritative kernel graph.
      - Define a source-neutral pickup proposal command and exact-identity suppression policies; the Cents adapter owns the exact PICKED_UP wire gate.
      - Define versioned, authorized, idempotent Accept and Reject command contracts and expected failures.
      - Delete proposal outcomes and source-driven canonical effects made unreachable by the new boundary.
    verifier:
      - Graph tests enumerate every allowed and denied edge.
      - Domain tests prove only the source-neutral pickup proposal kind is accepted; adapter tests separately prove exact PICKED_UP is the only emitted command.
      - Tests prove decided proposals cannot be updated or reopened.
      - Type and architecture tests keep business rules out of Worker, API, repositories, and Processor.
    rollback:
      - Revert the new proposal contracts and graph without changing persisted data.
    secret_handling: none
    status: pending
    evidence: []

  - id: T2
