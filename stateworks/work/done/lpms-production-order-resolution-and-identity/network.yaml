work_id: lpms-production-order-resolution-and-identity
title: LPMS production-order resolution and row identity
status: complete

goal:
  - Let managers remove old never-produced orders from active Processor work without deleting records or inventing floor completion.
  - Govern resolution and restoration through one explicit aggregate-owned Production lifecycle graph.
  - Deliver a version-bound single-order and bounded bulk backlog-review workflow with immutable audit.
  - Keep finished and resolved work out of operational projections while retaining sanitized History.
  - Standardize customer identity on every individual actionable order row and card without moving User or Order data into Production.

invariants:
  - Production execution remains unassigned to scheduled to finished and is never overloaded with archive or resolution meaning.
  - Production-order resolution is a separate persistent lifecycle with one authoritative state-and-event graph.
  - Every resolution or restoration transition is decided by the graph in Production policy; repositories, adapters, controllers, queries, and UI cannot define parallel transitions.
  - Resolved without production never means finished, deleted, canceled in Cents, or physically completed in Pressly.
  - External observations may remain audit context but cannot resolve, restore, or resurrect Pressly work after handoff.
  - Selected, batched, scheduled, active, routed, reconciled, or finished work cannot use the backlog-cleanup workflow.
  - Single and bulk mutations are location-authorized, versioned, idempotent, actor-audited, and serialized with conflicting scheduling work.
  - Bulk commit is bound to the exact server-owned candidate and version snapshot the manager reviewed.
  - Finished and resolved work remains retained and inspectable but is excluded from operational actions, counts, and forward demand.
  - Processor action availability and candidate classification remain server-owned.
  - Canonical customer identity is composed at the API-owned Processor read boundary and is never copied into Production persistence.
  - Paginated identity composition is batched for the bounded page and cannot introduce browser per-row fetches or backend N+1 access.
  - No global workflow engine, event-sourced rewrite, routine hard deletion, PII retention engine, or Production-owned customer profile is introduced.
  - This package cannot execute concurrently with the active operational-authority package or queued order-control correctness hardening.
  - Repository and local-runtime proof cannot be promoted into deployment, retention-policy, or pilot proof.
  - No secret, credential, customer payload, or private token enters Stateworks, tests, logs, screenshots, or commits.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

