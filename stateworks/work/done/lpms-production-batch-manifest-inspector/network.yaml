    action:
      - Inventory the current batch-card presentation, nested board-order data, identity-composition boundary, drawer primitive, tests, and dirty-file overlap.
      - Record the smallest coherent implementation and prove it cannot change Production lifecycle or floor truth.
    verifier:
      - Evidence names the exact contract, API, Processor, localization, and test files required by the implementation.
      - Evidence distinguishes existing dirty work from this package's write set.
      - Any domain or lifecycle change stops implementation for a Stateworks replan.
