work_id: lpms-production-batch-manifest-inspector
title: LPMS production batch manifest inspector
status: done

goal:
  - Let employees inspect every order in a live production batch without increasing the Production board height or losing their stage-action position.
  - Present the manifest in a 90%-viewport-height bottom drawer on desktop and mobile.
  - Compose canonical order and customer identity at the API-owned Processor read boundary without moving identity ownership into Production.

invariants:
  - The inspector is read-only and introduces no Production command, persistence, lifecycle state, transition, or scheduling behavior.
  - Stage Start and Complete remain owned by the existing Production board.
  - Production persists no customer identity; the API composes canonical identity into Processor-only contracts.
  - Nested batch identities are resolved in one bounded workspace composition with no browser per-row fetch or backend N+1 query.
  - Opening and closing the drawer does not change the board scroll position or selected production state.
  - The originating batch trigger receives focus when the drawer closes.
  - The drawer uses the existing shadcn primitive and Pressly design tokens, occupies 90% of the viewport height at every breakpoint, and scrolls internally.
  - Existing live refresh, stage actions, machine assignment, floor reconciliation, queue membership, and responsive stage navigation remain unchanged.
  - Existing user work and unrelated dirty files are preserved.
  - No secret, credential, customer payload, private token, or production data enters Stateworks, tests, screenshots, or commits.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

