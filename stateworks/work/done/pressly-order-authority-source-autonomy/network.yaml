work_id: pressly-order-authority-source-autonomy
title: Pressly order authority and source autonomy
status: active

goal:
  - Make Pressly canonical Orders and Production operable independently from
    unreliable external lifecycle behavior.
  - Bound every external claim with a versioned capability profile and
    Pressly-owned runtime posture.
  - Give operators clear, safe order-level commands and source-divergence
    context without granting adapters canonical authority.

invariants:
  - External adapters submit observations and never canonical lifecycle
    commands.
  - Only aggregate-owned explicit state-and-event graphs decide persistent
    Orders and Production transitions.
  - Numeric assurance and source health may only demote automation and never
    create or promote authority.
  - Canonical lifecycle, physical facts, derived projections, and Production
    resolution never follow an external source.
  - First-party ordering products invoke canonical User and Order commands and
    never gain Production floor authority.
  - Exact source identity, monotonic revision, hash, idempotency, optimistic
    concurrency, and transactional outbox guarantees remain intact.
  - Canonical current-state tables remain authoritative; no full event sourcing
    or generic cross-domain rules engine is introduced.
  - Existing source snapshots, command evidence, Production history, and
    ambiguous records are preserved.
  - Archive and restore remain audited, reversible Production resolution
    commands; hard deletion is out of scope.
  - Customer identity remains visible with order identity on operational rows.
  - The separate order-control correctness queue retains routing, capacity,
    idempotency-under-lock, and History cursor ownership.
  - No implementation, activation, migration, backfill, deployment, or runtime
    mutation begins without Steven's explicit green light.
  - No secret, credential, customer payload, or private token enters Stateworks
    or implementation evidence.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

