      - repo:modules/business/orders/src/persistence
      - repo:modules/business/orders/test
      - repo:modules/business/users/src
      - repo:modules/business/users/test
    action:
      - Accept a source-neutral ExternalOrderObservation without canonical
        lifecycle values.
      - Preserve stale, replay, equal-revision conflict, and valid-newer
        classification under exact source identity.
      - Evaluate each claim through the authority policy and current posture,
        retaining source lifecycle only as observation or proposal evidence.
      - Create prospective canonical records only in Pressly-selected initial
        graph states.
      - Apply approved non-lifecycle fields only through canonical use cases and
        complete field authority.
      - Commit the observation decision, adopted canonical changes, and any
        outbox event atomically.
    verifier:
      - Duplicated, delayed, missing, reordered, regressive, contradictory, and
        equal-revision-conflict observations are deterministic.
      - No external lifecycle sequence can release, withdraw, complete, cancel,
        archive, restore, or delete a canonical record.
      - A blocked source retains inspectable evidence without mutating
        canonical state.
      - Source loss does not block direct authorized Pressly commands.
    rollback:
      - Put the affected source into observe_only and retain every observation;
        do not restore direct lifecycle adoption.
    secret_handling: none
    status: pending
    evidence: []

