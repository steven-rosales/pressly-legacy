    action:
      - Define typed claim categories and an exhaustive pure evaluator that
        resolves deny, observe, propose, or auto_adopt by source, claim,
        canonical phase, current state, field authority, evidence, profile
        version, and source posture.
      - Model canonical Order, fulfillment release, and persistent source
