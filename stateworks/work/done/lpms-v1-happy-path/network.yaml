work_id: lpms-v1-happy-path
title: LPMS v1 happy path end to end
status: done

goal:
  - Deliver one usable flow from durable Cents demand through a deterministic schedule and operator-confirmed finished production.
  - Make the processor UI the real operating surface for schedule review, acceptance, and floor execution.
  - Preserve isolated modules by composing production, policy, and scheduling only in apps.

invariants:
  - No module imports, calls, or declares a package dependency on another module.
  - Apps are composition roots; policy and computation modules are headless.
  - Application authorization stays in access-control policy and is injected at the API boundary.
  - The production business module owns operational state, transactions, idempotency, and narrow injected ports.
  - Production policy injection is mandatory; a rejected invariant or transition cannot be bypassed by business or app code.
  - Runtime schemas stay in packages/contracts, persistence schemas stay in packages/db, and module tests stay outside src.
  - Every production stage uses the same positive scheduler_config.pulse_minutes value.
  - Production batches advance only at pulse boundaries, even when physical work finishes early.
  - Orders never split across production batches in v1, and bags are never assigned to machines.
  - pulse_capacity_lbs is the minimum of active washer, dryer, and folding capacity per pulse.
  - Schedule proposals are deterministic and immutable; accepting one creates exactly one production run.
  - Production writes and their work_event rows commit atomically or not at all.
  - CRM projection ordering uses vendor source version, not webhook arrival time.
  - The processor does not duplicate backend policy or invariants.
  - Existing user changes and unrelated worktree files are preserved.
  - Exception workflows remain deferred until the happy path is operationally reviewed.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

