  - id: T4
    title: Implement deterministic fixed-pulse scheduling
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps:
      - T0
    reads:
      - repo:docs/plan/lpms.md
      - repo:docs/agents/10
      - memory:domain:laundry-production/context-pack
    writes:
      - repo:modules/computation/scheduling
      - repo:pnpm-lock.yaml
    preconditions:
      - The accepted fixed-pulse calculations are available in domain memory and the canonical plan.
    action:
      - Create the @pressly/production-scheduling workspace with its first real computation and tests.
      - Create a headless computation module that maps an immutable scheduling snapshot to an immutable proposal.
      - Compute pulse capacity from washer, dryer, folding rate, effective folder count, and pulse minutes.
      - Apply priority and explicit planning-horizon selection before stable whole-order first-fit-decreasing packing.
      - Order candidates by priority, due bucket, weight descending, due time, and stable order ID.
      - Build four fixed stage slots per batch, assign machine capacity at stage level, and calculate makespan, completion, overflow, warnings, and unplaced orders.
      - Canonicalize output so equivalent inputs produce byte-equivalent plans and hashes.
    postconditions:
      - The scheduler performs no I/O and mutates no execution state.
      - Infeasible and oversized work is explicit rather than silently altered.
    verifier:
      - Orders weighing 150, 74, 140, 84, 130, 94, and 128 lb at 224 lb capacity pack as 224, 224, 224, and 128 lb and yield a 392-minute makespan.
      - Their variable bag counts remain attached to their orders throughout packing.
      - Five 160 lb orders prove that an 800 lb total can require five batches.
      - A 10:00 start forecasts 16:32 completion for the worked example.
      - Identical inputs produce byte-equivalent output.
      - Whole-order packing can exceed the weight-only lower bound.
      - Oversized, priority, horizon, capacity, and machine-assignment tests pass.
      - pnpm --filter @pressly/production-scheduling test
      - pnpm --filter @pressly/production-scheduling typecheck
      - pnpm --filter @pressly/production-scheduling lint
    rollback:
      - Remove the scheduling workspace only if no app composition depends on its public result.
    secret_handling: none
    status: committed
    evidence: []

