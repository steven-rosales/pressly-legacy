work_id: pressly-cellular-architecture-refactor
title: Pressly cellular modular-monolith architecture refactor
status: complete

goal:
  - Execute docs/plan/refactoring-cell.md and docs/plan/refactor-code-quality.md end to end as one behavior-preserving vertical migration.
  - Make systems, cells, experiences, hosts, platform mechanisms, topology, generated artifacts, state ownership, and dependency direction explicit.
  - Delete the superseded module architecture and custom enforcement only after every legacy owner has migrated and equivalent behavior is proven.

invariants:
  - Preserve public HTTP methods, paths, bodies, statuses, responses, cookies, CSRF, authentication, authorization, event contracts, and browser-visible behavior unless separately specified.
  - Preserve all laundry-production invariants and keep Orders commercial truth separate from Production physical-floor truth.
  - Preserve PostgreSQL transactions, locks, optimistic versions, idempotency, rollback, inbox/outbox delivery, leases, retries, dead letters, live revisions, and work-event semantics.
  - Exactly one implementation is authoritative for each state-changing operation; never dual-write during migration.
  - Use experiences as the canonical plural directory name and retain one topology authority.
  - Access owns canonical business-account and location scope identity; Customers owns customer profiles; no system writes or queries a peer system's schema.
  - Keep one ordered Drizzle migration ledger and runner for the shared PostgreSQL database throughout the refactor.
  - Keep platform/kernel separate from platform/cells and keep business roles and capabilities out of platform/auth.
  - Generated catalogs and clients are deterministic static artifacts with freshness checks; hosts contain no handwritten domain imports, routes, jobs, or branches.
  - Preserve the five application image names, services, ports, health checks, Caddy topology, release-manifest fields, immutable digest flow, and process lifecycle semantics.
  - Keep every checked-in Turbo entrypoint at concurrency two, Vitest unit paths at two workers, and database integration at one worker.
  - Preserve unrelated user-owned working-tree changes and never treat prior Stateworks or SHA-bound deployment evidence as proof of this refactor.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

