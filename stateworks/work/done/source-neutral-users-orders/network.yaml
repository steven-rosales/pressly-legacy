      - repo:apps/api/test/vendors/cents
      - repo:apps/worker/src/vendors/cents
      - repo:apps/worker/test/vendors/cents
    action:
      - Replace ignore decisions for customer and marketing events with typed observations and retain extra source fields in normalized snapshots.
      - Map orderCode, customer, services, money, due time, order lifecycle, and fulfillment release without leaking Cents vocabulary into a business module.
      - Compose exact User resolution before Order observation and make retries reuse earlier successful steps.
      - Create a skeletal User whenever an exact external customer ID exists, but persist the Order with an explicit unresolved-customer reason when the source genuinely supplies no customer identity.
      - Preserve the existing authenticated or explicitly unsigned ingress, size limit, deduplication, quarantine, and source-location binding behavior.
    postconditions:
      - Every supported Cents event kind reaches the correct canonical module and unsupported or malformed events remain diagnosable without exposing PII.
    verifier:
      - Contract and adapter fixtures cover all documented event kinds, aliases, extra fields, orderCode, embedded customer, and malformed payloads.
      - Worker tests cover existing-account linkage, skeletal User creation, absent-customer Order persistence, later reconciliation, User-before-Order sequencing, retry after partial success, stale source updates, and exact replay.
    rollback:
      - Restore the prior event consumers while leaving additive canonical data intact; do not replay or delete production events automatically.
    secret_handling: raw_payloads_only_in_encrypted_quarantine
    status: committed
    evidence:
      - stateworks/work/done/source-neutral-users-orders/evidence.md

