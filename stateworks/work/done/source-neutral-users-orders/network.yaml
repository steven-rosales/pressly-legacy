work_id: source-neutral-users-orders
title: Source-neutral Users, Orders, and Production admission
status: complete

goal:
  - Persist canonical Users, Orders, all supported Cents business observations, and source-neutral fulfillment admission without allowing source lifecycle to own Production floor truth.
  - Expose customer name and phone through composed Processor order views while preserving module isolation and retry-safe consistency.

invariants:
  - Peer business modules do not import one another; API and Worker own composition.
  - Auth identity, canonical User profile, commercial Order, fulfillment release, and Production execution remain separate facts.
  - Exact source links resolve external entities; phone and email never silently merge Users.
  - Every valid Order is canonicalized regardless of customer availability; a null customer User ID carries an explicit missingness reason.
  - A known exact source customer identity resolves or creates a skeletal User before Order persistence.
  - Cents lifecycle strings do not cross into Production business logic.
  - Pre-release work remains forecast-only and cannot enter executable scheduling.
  - Source completion cannot finish Production without LPMS confirmation.
  - Canonical Order mutation and its outbox event commit atomically.
  - No secret, raw customer payload, token, or private key enters Stateworks evidence, logs, or commits.
  - Existing unrelated worktree changes are preserved.
  - Domain memory changes require a separate verified source-backed delta.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

