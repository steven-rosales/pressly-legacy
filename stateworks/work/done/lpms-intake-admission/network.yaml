    writes:
      - repo:stateworks/work/active/lpms-intake-admission
    action:
      - Record the confirmed roles, source-truth boundary, reversal boundary, and UI ownership.
      - Keep the override in Production so commitment validation and mutation share one lock.
    verifier:
