work_id: lpms-intake-admission
title: LPMS manual production admission and dedicated Intake workspace
status: complete

goal:
  - Let authorized floor staff manually admit lagging Cents orders without changing vendor truth.
  - Keep intake work out of planning and live-production workspaces.
  - Permit safe pre-commit reversal under Production concurrency authority.
  - Remove prelaunch Cents-only orders through one fixed, idempotent production migration.

invariants:
  - Raw Cents lifecycle remains an external observation and is never forged by Processor.
  - The manual override is source-neutral and owned by Production admission policy.
  - Orders remains the authority for canonical order, fulfillment, customer, and source data.
  - Release and reversal serialize through the location scheduling lock.
  - Reversal is impossible after shift selection, scheduling, or active batch membership.
  - Manual release never selects an order or places it into a started run.
  - Valid weight and recorded bag intake remain required for executable eligibility.
  - Processor renders server-projected actions and owns no lifecycle policy.
  - Owner, admin, and operator authorization remains location-scoped.
  - Prelaunch cleanup preserves canonical users, webhook audit records, post-cutoff orders, and orders linked to any non-Cents source.
  - No secret, credential, customer payload, or private token enters Stateworks or fixtures.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

tasks:
