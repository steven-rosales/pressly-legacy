      - Map the current pickup-only normalizer, Worker, proposal graph, canonical acceptance, outbox, Production resolution, and Processor boundaries.
      - Distinguish retained authority infrastructure from policy and code that this work supersedes.
      - Record exact file overlap with the dirty worktree and other Stateworks work.
    verifier:
      - Evidence contains source-level or test-level proof for every superseded behavior.
      - Evidence records only aggregate live facts and contains no customer payload or credential.
