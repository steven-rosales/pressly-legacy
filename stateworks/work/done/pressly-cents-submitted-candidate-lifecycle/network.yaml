  - id: T1
    title: Define and persist the submitted candidate graph
    type: primitive
    owner: agent
    surface: database
    agent_can_verify: true
    deps:
      - T0
    reads:
      - repo:packages/kernel/src/state-machine.ts
      - repo:modules/business/orders/src/incoming-order-proposal
      - repo:packages/contracts/src/orders
      - repo:packages/db/src/schema/orders.schema.ts
      - repo:packages/db/src/migrations/0036_incoming-order-proposals.sql
    writes:
      - repo:modules/business/orders/src/incoming-order-proposal.policy.ts
      - repo:modules/business/orders/src/incoming-order-proposal
      - repo:modules/business/orders/test
      - repo:packages/contracts/src/orders
      - repo:packages/contracts/test
      - repo:packages/db/src/schema/orders.schema.ts
      - repo:packages/db/src/migrations
      - repo:packages/db/test
    action:
      - Replace pickup terminology with a source-neutral submitted candidate command and immutable snapshot.
      - Extend the authoritative candidate graph with source_close and explicit restore into a distinct manager-owned restored_pending state while keeping accepted and rejected terminal.
      - Persist current lifecycle version and append-only transition evidence without making the immutable candidate snapshot mutable.
      - Persist exact-identity source terminal tombstones and suppress late candidate creation.
      - Define versioned, idempotent manager restore and system source-close commands.
    verifier:
      - Graph tests enumerate every allowed and denied edge.
      - Database tests prove immutable snapshots, append-only transitions, terminal decisions, tombstone suppression, restored_pending source-close denial, and exact-identity concurrency.
      - Migration preserves existing accepted and rejected proposal evidence without canonical backfill or deletion.
    rollback:
      - Disable new source-close and restore commands while retaining additive evidence; do not delete canonical or historical rows.
    secret_handling: none
    status: pending
    evidence: []

  - id: T2
