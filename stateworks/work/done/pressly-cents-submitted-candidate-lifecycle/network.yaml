      - repo:packages/contracts/test
      - repo:apps/worker/src/jobs/process-webhook-inbox/cents
      - repo:apps/worker/test/jobs/process-webhook-inbox/cents
      - repo:apps/worker/src/bootstrap
    action:
      - Classify exact SUBMITTED as candidate evidence and exact COMPLETED or CANCELED as terminal evidence.
      - Retain the external Order identity, location, revision, and bounded normalized payload required by the relevant Orders command.
      - Acknowledge READY_FOR_PICKUP and every other known or unknown state as evidence-only.
      - Route classified observations through source-neutral Orders ports; keep lifecycle and duplicate policy out of API and Worker.
    verifier:
      - Adapter and Worker tests enumerate observed and unknown Cents states.
      - Only SUBMITTED can propose, and only COMPLETED or CANCELED can invoke source-close handling.
      - Duplicate, stale, terminal-before-submitted, submitted-after-terminal, existing canonical, accepted, and rejected cases are idempotent.
      - No Cents type crosses into Orders or Production.
    rollback:
      - Switch the classifier to evidence-only while retaining inbox receipts and candidate history.
    secret_handling: none
    status: pending
    evidence: []

  - id: T3
