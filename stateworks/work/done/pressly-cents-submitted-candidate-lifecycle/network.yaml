work_id: pressly-cents-submitted-candidate-lifecycle
title: Pressly Cents submitted candidate lifecycle
status: active

goal:
  - Replace the unobservable Cents PICKED_UP trigger with exact SUBMITTED candidate discovery.
  - Close unresolved candidates safely from Cents COMPLETED or CANCELED observations without granting Cents canonical authority.
  - Create accepted canonical Orders as unreleased work and preserve Pressly-owned intake, release, scheduling, execution, and resolution.

invariants:
  - Cents observations are external evidence and never select or execute a canonical Order, fulfillment, or Production transition.
  - Exact source and external Order identity is the only automatic correlation and duplicate-suppression key.
  - SUBMITTED may create one immutable pending candidate and no canonical work.
  - COMPLETED or CANCELED may close only a pending candidate or create an exact-identity tombstone.
  - A tombstone prevents late SUBMITTED delivery from resurrecting old work without an explicit Pressly command.
  - Incoming candidate transitions are owned by one authoritative kernel graph.
  - Accepted and rejected candidates are terminal, and a restored pending candidate is manager-owned; later source observations cannot rewrite, close, or reopen any of those states.
  - Accept creates one open canonical Order with unreleased fulfillment and copies the candidate snapshot once.
  - Physical intake and canonical release remain separate Pressly-owned readiness facts.
  - Source-terminal cleanup of accepted work can occur only through a named Pressly automation evaluated by the existing Production resolution graph and operational guard.
  - Work with intake, selection, scheduling, batch, route, stage, execution, or finished participation cannot be removed by a source observation.
  - Signed durable ingress, idempotency, command receipts, aggregate graphs, transactional outbox, and peer-domain boundaries remain intact.
  - No deployment, production replay, production-data cleanup, secret, credential, customer payload, or private token enters this work.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

