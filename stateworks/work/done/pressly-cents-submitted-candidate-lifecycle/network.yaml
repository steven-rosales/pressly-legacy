      - repo:modules/business/orders/test
      - repo:modules/business/production/src
      - repo:modules/business/production/test
      - repo:apps/worker/src
      - repo:apps/worker/test
    action:
      - Make Accept create an open canonical Order with unreleased fulfillment and preserve atomic source link, command receipt, and outbox evidence.
      - Add a source-neutral Pressly automation command that resolves an exact accepted fulfillment only when Production's existing resolution graph and guard prove no operational participation and no explicit review is required.
      - Return audit-only or review-required outcomes without changing canonical or Production state when the guard does not permit automation.
      - Never map source COMPLETED or CANCELED into canonical complete, cancel, withdraw, intake, release, admission, schedule, batch, stage, run, or finished events.
    verifier:
      - Orders tests prove accepted work is unreleased and later source observations cannot change it.
      - Production tests prove untouched work may be resolved nondestructively and all review-sensitive or participating work remains unchanged.
      - Cross-domain orchestration exists only at an application composition boundary.
      - Transactional outbox and fulfillment projection tests remain source-neutral.
    rollback:
      - Disable the cleanup automation while retaining source-terminal evidence; never weaken the Production guard.
    secret_handling: none
    status: pending
    evidence: []

