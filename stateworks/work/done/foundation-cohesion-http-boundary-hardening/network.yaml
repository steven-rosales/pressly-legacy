    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps: [T1, T2, T3, T4]
    reads:
      - repo:docs/architecture.md
      - repo:docs/module-architecture.md
    writes:
      - repo:docs/architecture.md
      - repo:docs/module-architecture.md
      - repo:docs/security/application-controls.md
      - repo:docs/plan/lpms-state-transitions.md
      - repo:AGENTS.md
      - repo:stateworks/work/done/foundation-cohesion-http-boundary-hardening
    action:
      - Document the consumer-set placement rule, continuity exception, feature operation rule, and canonical HTTP algebra.
      - Record exact implementation and verification evidence.
    verifier:
      - Documentation, agent guidance, and executable rules agree.
    rollback: Revert documentation with the executable rule it describes.
    secret_handling: none
    status: committed
