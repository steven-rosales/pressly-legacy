work_id: lpms-order-control-history
title: LPMS order control and production history
status: complete

goal:
  - Give employees bounded order-level control without creating a second execution authority.
  - Separate queued rebatching from in-flight defer or rework and preserve whole-order hard-capacity invariants.
  - Provide server-paginated Home and read-only History projections.
  - Record and apply implementation-backed laundry-production memory v9.

invariants:
  - stage_run remains the sole canonical batch-stage transition authority.
  - Every route moves one complete order and preserves one active batch membership.
  - Queued rebatch uses the exact selected mutable target; in-flight routes use the earliest feasible later target.
  - production_order_stage_attempt records immutable assignment identity and terminal completion or release, not an independent state machine.
  - Route preview and commit are version-, actor-, scope-, and proposal-bound.
  - Hard capacity, queue versioning, affected-row checks, and idempotency remain mandatory.
  - Home and History use bounded server keyset pagination.
  - Public History never exposes raw work-event payloads or private idempotency data.
  - Sole-order empty-batch routing remains explicitly rejected in v1.
  - Existing floor-reconciliation evidence and the production-readiness human gate remain unchanged.
  - No secret, credential, customer payload, or production connection string enters Stateworks.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

