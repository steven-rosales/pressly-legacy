work_id: lpms-production-batch-manifest-responsive-refinement
title: LPMS production batch manifest responsive refinement
status: complete

goal:
  - Give each live production batch exactly one manifest entry point in Batch membership.
  - Use a non-draggable 90%-viewport-height bottom Sheet with a semantic order table on desktop.
  - Retain the draggable 90%-viewport-height Drawer and stacked order cards on mobile.
  - Preserve the compact Production stage board and every existing floor action.

invariants:
  - The refinement is read-only Processor presentation and introduces no contract, API, database, Production policy, lifecycle graph, scheduling, queue, or command change.
  - Batch membership owns exactly one explicit View orders action per batch.
  - Stage cards show order-and-bag totals as passive scan context and never open the manifest.
  - The desktop Sheet and mobile Drawer consume one selected-batch view model and the same canonical projection facts.
  - The desktop surface is bottom-anchored, non-draggable, has no drag handle, occupies 90 dynamic viewport-height units, and scrolls internally beneath a fixed toolbar and sticky table headings.
  - The mobile surface retains the draggable Drawer, stacked cards, 90 dynamic viewport-height geometry, and touch targets of at least 44 pixels.
  - Opening, switching batches, and closing preserve the Production board scroll position and return focus to the originating Batch membership action.
  - Existing live refresh, stage actions, machine assignment, floor reconciliation, membership mutation, and responsive stage navigation remain unchanged.
  - Existing user work and unrelated dirty files are preserved.
  - No secret, credential, customer payload, private token, or production data enters Stateworks, tests, screenshots, or commits.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

tasks:
  - id: T0
    title: Rebaseline the manifest presentation
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps: []
    reads:
      - memory:domain:steven-collaboration/context-pack
      - memory:domain:laundry-production/context-pack
      - repo:stateworks/work/done/lpms-production-batch-manifest-inspector
      - repo:stateworks/work/active/lpms-production-readiness
      - repo:apps/processor/src/features/production-board/production-board.view.tsx
      - repo:apps/processor/src/features/production-board/batch-order-inspector.view.tsx
      - repo:apps/processor/src/components/ui/drawer.tsx
      - repo:apps/processor/src/components/ui/sheet.tsx
      - repo:apps/processor/src/components/ui/table.tsx
      - repo:apps/processor/test/features/production-board
    writes:
      - repo:stateworks/work/done/lpms-production-batch-manifest-responsive-refinement/evidence.md
    action:
      - Inventory every current manifest trigger, the Batch membership cards, responsive primitives, selected-batch state, focus restoration, localization, and focused tests.
      - Record the exact Processor-only write set and any overlap with existing dirty work.
      - Prove that the existing enriched board projection already contains every fact required by both responsive presentations.
    verifier:
      - Evidence names every duplicate manifest entry point and the one Batch membership action that will replace them.
      - Evidence proves no contract, API, Production domain, lifecycle, persistence, or scheduling change is required.
      - Any missing canonical fact or required operational behavior change stops implementation for a Stateworks replan.
    rollback:
      - No rollback is needed for the read-only audit; revert only unsupported evidence.
    secret_handling: none
    status: committed
    evidence:
      - stateworks/work/done/lpms-production-batch-manifest-responsive-refinement/evidence.md

  - id: T1
    title: Consolidate manifest entry and responsive presentation
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps:
      - T0
    reads:
      - repo:apps/processor/src/features/production-board/production-board.view.tsx
      - repo:apps/processor/src/features/production-board/batch-order-inspector.view.tsx
      - repo:apps/processor/src/components/ui/drawer.tsx
      - repo:apps/processor/src/components/ui/sheet.tsx
      - repo:apps/processor/src/components/ui/table.tsx
      - repo:apps/processor/src/i18n/locales
      - repo:apps/processor/test/features/production-board
    writes:
