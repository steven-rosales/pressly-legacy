    action:
      - Rename Queue membership to Batch membership and add order, bag, and weight totals plus one explicit View orders action to each batch card without swallowing existing membership controls.
      - Replace every stage-card manifest trigger with non-interactive order-and-bag summary text while preserving card height and stage actions.
      - Render a non-draggable bottom Sheet with a wide semantic table and sticky headings at desktop widths.
      - Render the existing draggable bottom Drawer with stacked order cards at mobile and narrow tablet widths.
      - Share selected-batch state, manifest facts, batch switching, close handling, scroll preservation, and focus restoration across both shells without mounting two active modal surfaces.
    verifier:
