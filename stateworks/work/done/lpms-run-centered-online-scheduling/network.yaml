    preconditions:
      - T0 confirms fixed-pulse resource, ordering, and stage-window representations.
      - Pure computation receives values and returns decisions without database, HTTP, clock, random-ID, or logging dependencies.
    action:
      - Add fixed-pulse-ffd-v2 global planning over the complete eligible-order snapshot while preserving deterministic hashes, stable tie-breakers, whole-order capacity, and v1 historical readability.
      - Add online-stable-insertion-v1 as a pure sibling computation over an ordered versioned queue, arriving order, fixed resource snapshot, and optional exact target.
      - Place priority arrivals in the earliest feasible mutable batch or create a positioned priority batch after all frozen or in-flight anchors and existing priority work.
      - Place ordinary arrivals in the best-fitting mutable batch with earliest-sequence tie-break, or append a new batch.
      - Reject an unavailable, frozen, non-queued, or over-capacity exact target without selecting a fallback.
      - Preserve every existing order membership and all frozen stage windows; reproject only the affected mutable suffix when a new batch changes sequence.
      - Return a canonical placement hash, proposed queue version, affected suffix, projected completion, and overtime state.
      - Add policy decisions for current-plan acceptance, Start preconditions, freeze and queued-only unfreeze, implicit freeze on batch start, hard capacity, and manager-only overtime or exact placement capabilities.
      - Use discriminated unions for valid decisions and expected rejections; do not add generic factories, managers, solver registries, or framework dependencies.
    postconditions:
      - The pure core cannot mutate execution and has no framework or persistence imports.
      - Automatic placement has zero recourse over existing memberships.
      - Frozen or in-flight work is an irrevocable anchor and hard capacity is universal.
      - Identical inputs produce identical plans, insertion proposals, hashes, and overtime results.
    verifier:
      - pnpm --filter @pressly/production-scheduling test
      - pnpm --filter @pressly/production-scheduling typecheck
      - pnpm --filter @pressly/production-scheduling lint
      - pnpm --filter @pressly/production-policy test
