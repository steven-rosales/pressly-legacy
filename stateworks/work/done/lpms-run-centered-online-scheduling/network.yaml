work_id: lpms-run-centered-online-scheduling
title: LPMS run-centered online scheduling
status: complete

goal:
  - Separate immutable pre-start planning from execution commitment through Compute, Review/Accept, and Start.
  - Enforce one stable production run per shift and place post-start arrivals without silently moving existing orders.
  - Make backend state and explicit shift/run identities authoritative across refresh, concurrency, and overtime confirmation.

invariants:
  - Exactly one production_run may exist for one production shift, and only Start creates it.
  - Accept persists preference for the current immutable schedule revision but creates no execution graph or scheduled-order transitions.
  - Compute includes every currently eligible shift order, supersedes the previous current revision, and revokes its acceptance.
  - Start requires the accepted revision to remain current and its complete eligible-order snapshot to remain unchanged.
  - After Start, newly eligible orders enter the existing run and never create a sibling run.
  - Automatic live placement never relocates an existing order in v1.
  - Batch execution state and membership freeze are orthogonal; every non-queued batch is permanently frozen.
  - Hard pulse capacity cannot be overridden by automatic placement, exact placement, or overtime acceptance.
  - Every queue or membership mutation is expected-version guarded, atomically audited, and follows one run-first lock order.
  - Overtime acceptance is bound to the exact proposal hash and queue version reviewed by the manager.
  - Production business and policy remain headless; computation remains pure; apps remain the composition roots.
  - Existing user changes, historical evidence, and deployed migration history are preserved.
  - No secret, customer payload, bearer credential, or production connection string enters Stateworks or test evidence.
  - SSE, drag-and-drop, silent live reoptimization, split orders, and exception workflows remain outside this work.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

