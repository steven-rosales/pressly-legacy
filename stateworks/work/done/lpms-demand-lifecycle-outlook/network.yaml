      - repo:modules/computation/scheduling/test
      - repo:modules/business/production/test
    action:
      - Compute the local service-day cutoff from the shift timezone and end date.
      - Read non-withdrawn, in-horizon demand with its production admission and reconciliation state.
      - Produce deterministic weight-only advisory batches without fabricating bag counts.
      - Extend the existing location-authorized Production workspace with known, ready, expected, inbound, mismatch, batch, and forecast-finish summaries.
    postconditions:
      - Advisory totals and batches cannot be accepted, started, or written back as schedule runs.
      - Existing executable schedule semantics and snapshot validation are unchanged.
    verifier:
