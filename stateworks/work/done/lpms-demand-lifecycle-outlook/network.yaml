      - repo:modules/policy/production/src
      - repo:modules/business/production/src/apply-order-demand
      - repo:modules/business/production/src/record-order-intake
      - repo:packages/contracts/src
      - repo:packages/db/src/schema/laundry-production.schema.ts
      - repo:packages/db/src/migrations
    writes:
      - repo:apps/worker/src/vendors/cents
      - repo:modules/policy/production/src/demand-lifecycle
      - repo:modules/business/production/src/apply-order-demand
      - repo:modules/business/production/src/record-order-intake
      - repo:packages/contracts/src/production
      - repo:packages/db/src/schema/laundry-production.schema.ts
      - repo:packages/db/src/migrations
      - repo:packages/db/src/migrations/meta
      - repo:modules/policy/production/test
      - repo:modules/business/production/test
      - repo:apps/worker/test
    preconditions:
      - T0 confirms vendor status mapping and the current committed-order rejection seam.
    action:
      - Map Cents statuses to canonical expected, inbound, production_released, post_production, and withdrawn phases at the adapter boundary.
      - Persist phase, source status code, estimated weight, weight provenance, and every strictly newer source revision.
      - Separate source projection from safe Production mutation through a pure lifecycle policy.
      - Permit operator intake to establish production readiness despite source lag without weakening bag-count or weight rules.
      - Preserve committed floor state and derive reconciliation attention for downstream or cancellation conflicts.
    postconditions:
      - Production contains no Cents status branch.
      - Strictly newer source revisions do not dead-letter merely because execution has begun.
      - Physical intake can admit expected or inbound demand.
      - Source reconciliation never mutates canonical floor progression.
    verifier:
      - pnpm --filter @pressly/production-policy test
      - pnpm --filter @pressly/production-policy typecheck
      - pnpm --filter @pressly/production test
      - pnpm --filter @pressly/production test:integration
      - pnpm --filter @pressly/worker test
      - pnpm --filter @pressly/contracts test
      - pnpm --filter @pressly/db test
      - pnpm --filter @pressly/db test:integration
    rollback:
