work_id: lpms-demand-lifecycle-outlook
title: LPMS demand lifecycle and advisory outlook
status: complete

goal:
  - Make pre-intake Cents demand visible for shift planning without admitting it to executable production.
  - Let physical intake admit an order despite a lagging Cents status while preserving whole-order production invariants.
  - Surface downstream Cents and LPMS disagreements for operator-confirmed reconciliation rather than automatic completion.

invariants:
  - LPMS operator-confirmed stage and batch state remains the sole production-floor truth.
  - The scheduler proposal path continues to include only admitted production orders with positive weight and a recorded bag count.
  - Advisory demand forecasts are deterministic, read-only, non-persistent, non-acceptable, and non-executable.
  - Vendor status strings terminate in the Worker adapter and never become Production policy branches.
  - Source revisions remain serialized, idempotent, and location-bound.
  - Expected demand is never represented as zero bags or silently promoted to floor work.
  - A downstream Cents status cannot finish an LPMS order, batch, run, or shift.
  - Cancellations cannot silently remove physically received or committed production work.
  - Existing module boundaries remain intact and apps remain the composition roots.
  - Processor UI composes existing shadcn primitives and the established ElevenLabs-derived visual language.
  - Operator messages contain actionable domain language and no internal UUIDs.
  - Existing unrelated worktree changes are preserved.
  - No secret, credential, customer payload, or private token enters Stateworks or fixtures.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

