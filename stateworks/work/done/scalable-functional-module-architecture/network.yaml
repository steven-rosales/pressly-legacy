work_id: scalable-functional-module-architecture
title: Scalable functional module architecture
status: complete

goal:
  - Make repository placement, ownership, dependency direction, and feature traversal deterministic before substantial product growth.
  - Implement a declarative functional hexagonal architecture without ceremonial layers or behavior changes.
  - Encode the architecture as immutable manifests, pure compiler rules, lint, tests, and durable documentation.

invariants:
  - Preserve current business behavior and all laundry-production invariants.
  - Keep modules isolated peers; only apps compose multiple modules.
  - Keep protocol contracts at trust or process boundaries and module application language inward.
  - Return expected business failures as typed data and reserve exceptions for unexpected failures.
  - Do not hide clocks, IDs, transactions, network, persistence, or other effects in pure code.
  - Do not add empty role files, generic repositories, a DI container, service locator, base entity hierarchy, or universal policy engine.
  - Do not claim the queued LPMS routing and History correctness gaps are solved.
  - Preserve user-owned unrelated working-tree changes and do not expose secrets or customer data.

max_repair_attempts: 3
stop_on:
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

tasks:
  - id: T0
    title: Baseline behavior and migration inventory
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps: []
    reads:
      - repo:modules
      - repo:apps
      - repo:packages
      - repo:tooling/architecture
      - repo:stateworks/work/queued/lpms-order-control-correctness-hardening
    writes:
      - repo:stateworks/work/done/scalable-functional-module-architecture/evidence.md
    action:
      - Inventory current authorities, dependencies, suffixes, protocol boundaries, and runtime composition.
      - Record characterization protection for Production slices affected by queued correctness debt.
    verifier:
      - The evidence names every current module and its target authority.
      - The queued LPMS gaps remain explicitly unsolved.
    rollback:
      - No rollback; this task records the migration baseline.
    secret_handling: none
    status: committed
    evidence:
      - stateworks/work/done/scalable-functional-module-architecture/evidence.md#t0---baseline-behavior-and-migration-inventory

  - id: T1
    title: Compile Architecture Compiler v2
    type: primitive
    owner: agent
    surface: repo
    agent_can_verify: true
    deps:
      - T0
    reads:
      - repo:tooling/architecture
      - repo:eslint.config.mjs
    writes:
