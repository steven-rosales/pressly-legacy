      - repo:tooling/test
      - repo:eslint.config.mjs
    action:
      - Add per-module manifests, auto-discovery, namespaces, feature and foundation profiles, qualified roles, dependency graph rules, and pure-role constraints.
      - Keep a compatibility compiler only while modules are migrated.
    verifier:
      - pnpm typecheck:architecture
      - VITEST_MAX_WORKERS=2 pnpm exec vitest run tooling/test/architecture-compiler-v2.test.mjs tooling/test/architecture-discovery.test.mjs tooling/test/architecture-eslint-v2.test.mjs tooling/test/architecture-topology-v2.test.mjs tooling/test/architecture-boundaries.test.mjs
      - pnpm architecture:check
      - pnpm lint:architecture
    rollback:
      - Restore the v1 compiler while retaining the inventory and characterization evidence.
    secret_handling: none
    status: committed
    evidence:
      - stateworks/work/done/scalable-functional-module-architecture/evidence.md#t1---compile-architecture-compiler-v2

