work_id: lpms-operational-authority-remaining-day-forecast
title: LPMS operational authority and remaining-day forecast
status: done

goal:
  - Make Pressly canonical lifecycle authoritative after a one-way external-source handoff while retaining valid source observations.
  - Consolidate true persistent Orders and Production lifecycle transitions into aggregate-owned explicit graphs.
  - Deliver a deterministic remaining-day forecast contract and focused Processor information architecture.
  - Remove source-versus-Pressly comparison work from production-floor surfaces.
  - Move post-start ready-order placement into Schedule while keeping Production focused on physical execution.

invariants:
  - Valid newer source observations are retained independently from canonical lifecycle adoption.
  - After handoff, external lifecycle values cannot rewind, complete, cancel, withdraw, or otherwise terminalize Pressly lifecycle.
  - Source-owned non-lifecycle fields retain their independent authority and source-revision rules.
  - Orders publishes source-neutral fulfillment demand atomically and Production never interprets a vendor lifecycle code.
  - Each true persistent aggregate lifecycle has one authoritative graph; derived readiness, milestones, attention, and forecast remain projections.
  - No global workflow engine, event-sourced rewrite, microservice split, or silent live reoptimization is introduced.
  - Whole-order, hard-capacity, explicit-selection, run-first-lock, queue-version, and operator-confirmed floor invariants remain active.
  - Processor actions and action availability remain server-owned.
  - Post-start placement targets the explicit existing run, preserves the accepted immutable schedule, and never relocates existing work automatically.
  - Schedule date selection uses shared shadcn Calendar and Popover primitives rather than native browser date controls.
  - Repository and local-runtime proof cannot be promoted into deployment or pilot proof.
  - No secret, credential, customer payload, or private token enters Stateworks, tests, logs, screenshots, or commits.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

