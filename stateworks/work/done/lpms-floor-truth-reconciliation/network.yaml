work_id: lpms-floor-truth-reconciliation
title: LPMS floor truth reconciliation
status: complete

goal:
  - Treat planned stage windows as useful forecasts and reservations without allowing them to contradict operator-confirmed physical truth.
  - Permit otherwise-valid early starts through exact current confirmation while preserving every hard production invariant and the accepted plan.
  - Reconcile missed floor progress after reconnect through one atomic, forward-only, auditable batch command.
  - Prove the implementation before advancing laundry-production memory from v7 to v8.

invariants:
  - Planned stage windows remain immutable forecasts and resource reservations.
  - Early starts and completions cannot bypass predecessor, run, stage-kind, machine, capacity, version, or idempotency constraints.
  - A timing exception succeeds only through an actor-bound, version-bound, timing-bound confirmation revalidated under lock.
  - Floor reconciliation moves one coherent started-run batch only to a strictly later canonical milestone.
  - The reconciliation proposal binds the actor, target, reason, note, selected machines, queue version, batch version, four stage versions, and exact effects.
  - Skipped timestamps and historical machine assignments remain unknown; no synthetic stage events are written.
  - A reconciled queued batch uses the reconciliation commit time as its LPMS started lifecycle anchor, not as a reconstructed physical stage timestamp.
  - One reconciliation transaction writes one batch_progress_reconciled work event and causes one SSE invalidation.
  - Reconciliation to finished has terminalization parity with ordinary final-stage completion.
  - Stage rows remain current projections and work events remain the mutation ledger; this is not full event sourcing.
  - Recovery operates after reconnect and does not introduce an offline browser command queue or PWA execution mode.
  - Backward correction, reopen, concurrent same-kind execution, and existing exception workflows remain deferred.
  - Existing user changes, historical evidence, deployed migrations, and the active production-readiness human gate are preserved.
  - No secret, credential, signature, raw customer payload, or production connection string enters Stateworks evidence.
  - Durable memory is not advanced until full verification passes on one final checkout.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

