work_id: pressly-cellular-architecture-fidelity-completion
title: Pressly cellular architecture fidelity completion
status: done

goal:
  - Implement the exact repository and code-quality target in docs/plan/refactoring-cell.md and docs/plan/refactor-code-quality.md.
  - Remove apps, packages, legacy, compatibility, and stale generated/build residue after verified replacement.
  - Prove every operation through real owner-local code and behavior evidence rather than path-existence heuristics.

invariants:
  - Preserve external protocols, durable state semantics, distributed delivery behavior, authorization, and browser workflows.
  - Preserve the protected Pricing catalog exactly while replacing the compatibility-era 40-file history with one clean immutable database epoch and one shared PostgreSQL topology, as authorized at H1.
  - Preserve five production image and service identities while moving their source entrypoints into the final architecture.
  - One independently observable operation owns one unique cell path.
  - Applicable contracts, decisions, executors, persistence, and tests are operation-owned and locally traversable.
  - No owner-level fallback or bare file reference may certify an operation-level behavioral obligation.
  - Final source roots contain no apps, packages, modules, central business contract/schema authority, or retired compiler residue.
  - Independent LPMS and Control work status and evidence remain unchanged.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

