work_id: lpms-shift-order-selection
title: LPMS production admission and shift order selection
status: complete

goal:
  - Keep pre-IN_PROGRESS Cents demand forecast-only while preserving physical intake facts.
  - Require IN_PROGRESS and completed intake before an order is selectable for production.
  - Make schedule inclusion an explicit, server-authoritative, shift-scoped manager decision.

invariants:
  - Source lifecycle, physical intake, production readiness, and shift selection are separate facts.
  - Expected or inbound demand cannot become executable production work.
  - Physical intake may be recorded before release but cannot bypass the IN_PROGRESS gate.
  - Only production-released orders with positive weight and recorded bag count are ready candidates.
  - Ready candidates are unselected by default.
  - Shift selection is versioned, audited, location-bound, and manager-authorized.
  - Compute reads exactly the selected ready candidates for its shift.
  - Selection changes supersede the current plan and revoke acceptance before Start.
  - New unselected candidates do not change an immutable selected schedule snapshot.
  - Start freezes the selected set as schedule provenance.
  - A post-start ready order requires explicit manager placement and is never silently committed.
  - The scheduler remains pure and does not own selection persistence.
  - Processor contains no lifecycle, eligibility, or concurrency policy.
  - Existing unrelated worktree changes and deployed migration history are preserved.
  - No secret, credential, customer payload, or private token enters Stateworks or fixtures.

max_repair_attempts: 3
stop_on:
  - human_action_required
  - destructive_change_required
  - repeated_verifier_failure
  - invariant_violation

