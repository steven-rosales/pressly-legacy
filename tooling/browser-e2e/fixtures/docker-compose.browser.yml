services:
  api:
    environment:
      API_CONTROL_MUTATION_RATE_LIMIT: '120'

  caddy:
    depends_on: !override
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      processor:
        condition: service_healthy
      control:
        condition: service_healthy
    volumes: !override
      - ${PRESSLY_BROWSER_E2E_FIXTURE_DIR:?}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
